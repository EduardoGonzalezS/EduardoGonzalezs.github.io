<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japón 2026 — Tickets</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎟️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    button { background: none; border: none; cursor: pointer; font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }

    :root {
      --ink:        #1a1a2e;
      --ink-light:  #2d2d4a;
      --paper:      #faf8f5;
      --fog:        #e0dbd4;
      --muted:      #8a8070;
      --gold:       #c9a84c;
      --gold-lt:    #e8c97a;
      --crimson:    #c0392b;
      --crimson-lt: #e74c3c;
      --indigo:     #2c3e6b;
      --green:      #1e6b34;  --green-bg: #d4edda;
      --amber:      #856404;  --amber-bg: #fff3cd;
      --red-txt:    #842029;  --red-bg:   #f8d7da;
      --font-d: 'Cinzel', serif;
      --font-j: 'Noto Serif JP', serif;
      --font-b: 'Inter', system-ui, sans-serif;
      --r-sm: 6px; --r-md: 12px; --r-lg: 20px; --r-pill: 999px;
      --sh-sm: 0 2px 12px rgba(26,26,46,.08);
      --sh-md: 0 4px 24px rgba(26,26,46,.14);
      --sh-xl: 0 16px 64px rgba(26,26,46,.22);
    }

    body {
      font-family: var(--font-b); background: var(--paper); color: var(--ink);
      max-width: 480px; margin-inline: auto; min-height: 100dvh;
      overflow-x: hidden; padding-bottom: 80px;
    }

    /* HEADER */
    .header { background: var(--ink); padding: 28px 16px 16px; position: relative; overflow: hidden; }
    .header::before { content: '券'; position: absolute; right: -4px; top: -8px; font-family: var(--font-j); font-size: 9rem; color: rgba(255,255,255,.04); pointer-events: none; line-height: 1; }
    .header__gif { position: absolute; top: 16px; right: 16px; width: 54px; height: 54px; object-fit: contain; border-radius: var(--r-sm); z-index: 2; }
    .header__jp { font-family: var(--font-j); font-weight: 300; font-size: .875rem; color: var(--gold); letter-spacing: .3em; display: block; margin-bottom: 4px; }
    .header__title { font-family: var(--font-d); font-size: 2.2rem; font-weight: 700; color: #fff; letter-spacing: .15em; line-height: 1; margin-bottom: 5px; }
    .header__sub { font-size: .72rem; color: rgba(255,255,255,.42); letter-spacing: .1em; text-transform: uppercase; }
    .header__divider { height: 1px; margin-top: 16px; opacity: .5; background: linear-gradient(90deg, var(--gold) 0%, transparent 80%); }

    /* SUMMARY */
    .summary { display: grid; grid-template-columns: repeat(3,1fr); background: var(--ink-light); border-bottom: 1px solid rgba(255,255,255,.06); }
    .summary__item { display: flex; flex-direction: column; align-items: center; padding: 11px 8px; gap: 2px; }
    .summary__item + .summary__item { border-left: 1px solid rgba(255,255,255,.06); }
    .summary__val { font-family: var(--font-d); font-size: 1.1rem; font-weight: 700; color: var(--gold-lt); }
    .summary__lbl { font-size: .55rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.38); }

    /* FILTER TABS */
    .tabs { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; background: var(--paper); border-bottom: 1px solid var(--fog); position: sticky; top: 0; z-index: 20; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; padding: 5px 14px; border-radius: var(--r-pill); font-size: .7rem; font-weight: 600; letter-spacing: .04em; border: 1.5px solid var(--fog); color: var(--muted); background: transparent; cursor: pointer; transition: all 150ms; -webkit-tap-highlight-color: transparent; }
    .tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .tab:hover:not(.active) { border-color: var(--muted); color: var(--ink); }

    /* LOADING / ERROR / EMPTY */
    .state-msg { text-align: center; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .state-msg__icon { font-size: 2.5rem; }
    .state-msg__title { font-family: var(--font-d); font-size: .9rem; font-weight: 700; letter-spacing: .06em; color: var(--ink); }
    .state-msg__sub { font-size: .75rem; color: var(--muted); }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--fog); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MAIN */
    main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .city-sep { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .city-sep__jp { font-family: var(--font-j); font-size: .75rem; color: var(--gold); }
    .city-sep__name { font-family: var(--font-d); font-size: .58rem; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
    .city-sep__line { flex: 1; height: 1px; background: var(--fog); }

    /* TICKET CARD */
    .tcard { background: #fff; border-radius: var(--r-lg); border: 1px solid var(--fog); box-shadow: var(--sh-sm); overflow: hidden; transition: box-shadow 180ms; }
    .tcard:hover { box-shadow: var(--sh-md); }
    .tcard__top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
    .tcard__icon { width: 44px; height: 44px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-size: 1.45rem; flex-shrink: 0; }
    .tcard__info { flex: 1; min-width: 0; }
    .tcard__name { font-family: var(--font-d); font-size: .85rem; font-weight: 700; color: var(--ink); letter-spacing: .04em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .tcard__meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tcard__date { font-size: .66rem; color: var(--muted); font-weight: 500; }
    .badge { font-size: .56rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: var(--r-pill); }
    .badge--ok   { background: var(--green-bg); color: var(--green); }
    .badge--pend { background: var(--amber-bg); color: var(--amber); }
    .badge--out  { background: var(--red-bg);   color: var(--red-txt); }
    .tcard__menu-btn { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background 140ms, color 140ms; }
    .tcard__menu-btn:hover { background: var(--fog); color: var(--ink); }
    .tcard__menu-btn svg { width: 17px; height: 17px; fill: currentColor; }
    .tcard__arrow { width: 26px; height: 26px; border-radius: 50%; background: var(--paper); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: transform 260ms, background 160ms; }
    .tcard.open .tcard__arrow { transform: rotate(180deg); background: var(--fog); }
    .tcard__arrow svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* Tear line */
    .tear { border: none; border-top: 1.5px dashed var(--fog); margin: 0 16px; display: none; position: relative; }
    .tear::before, .tear::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--fog); }
    .tear::before { left: -20px; } .tear::after { right: -20px; }
    .tcard.open .tear { display: block; }

    .tcard__body { max-height: 0; overflow: hidden; transition: max-height 300ms ease; }
    .tcard.open .tcard__body { max-height: 1000px; }

    /* ITEMS */
    .items { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .item { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; padding: 10px 12px; background: var(--paper); border-radius: var(--r-md); border: 1px solid transparent; transition: border-color 150ms; }
    .item:hover { border-color: var(--fog); }
    .item__icon { font-size: 1.05rem; line-height: 1; }
    .item__info { min-width: 0; }
    .item__name { font-size: .8rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item__date { font-size: .62rem; color: var(--muted); margin-top: 1px; }
    .item__drive { display: inline-flex; align-items: center; gap: 5px; font-size: .65rem; font-weight: 700; color: #fff; background: #1a73e8; padding: 5px 10px; border-radius: var(--r-pill); flex-shrink: 0; transition: background 140ms, transform 120ms; white-space: nowrap; }
    .item__drive:hover { background: #1558b0; transform: scale(1.03); }
    .item__drive:active { transform: scale(.97); }
    .item__drive svg { width: 11px; height: 11px; fill: currentColor; flex-shrink: 0; }
    .item__no-drive { font-size: .62rem; color: var(--fog); white-space: nowrap; flex-shrink: 0; }
    .item__edit { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background 140ms, color 140ms; }
    .item__edit:hover { background: rgba(44,62,107,.1); color: var(--indigo); }
    .item__edit svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .item.is-busy { opacity: .5; pointer-events: none; }

    .items__add { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: var(--r-md); border: 1.5px dashed var(--fog); color: var(--muted); font-size: .72rem; font-weight: 600; cursor: pointer; transition: all 140ms; width: 100%; background: none; -webkit-tap-highlight-color: transparent; }
    .items__add:hover { border-color: var(--indigo); color: var(--indigo); background: rgba(44,62,107,.04); }
    .items__add:disabled { opacity: .5; cursor: not-allowed; }
    .items__add svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* FAB */
    .fab { position: fixed; bottom: 80px; right: max(16px, calc(50% - 240px + 16px)); width: 52px; height: 52px; border-radius: 50%; background: var(--crimson); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(192,57,43,.45); cursor: pointer; border: none; z-index: 100; transition: background 150ms, transform 150ms; -webkit-tap-highlight-color: transparent; }
    .fab:hover { background: var(--crimson-lt); transform: scale(1.06); }
    .fab:active { transform: scale(.96); }
    .fab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

    /* MODAL */
    .overlay { position: fixed; inset: 0; z-index: 300; background: rgba(10,10,24,.65); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 200ms; }
    .overlay.on { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; background: var(--paper); border-radius: var(--r-lg) var(--r-lg) 0 0; z-index: 301; max-height: 92dvh; display: flex; flex-direction: column; transition: transform 270ms cubic-bezier(.32,.72,0,1); }
    .overlay.on .drawer { transform: translateX(-50%) translateY(0); }
    .drawer__pill { width: 36px; height: 4px; background: var(--fog); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
    .drawer__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid var(--fog); flex-shrink: 0; }
    .drawer__title { font-family: var(--font-d); font-size: .88rem; font-weight: 700; letter-spacing: .05em; }
    .drawer__close { width: 32px; height: 32px; border-radius: 50%; background: var(--fog); display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background 140ms; }
    .drawer__close:hover { background: var(--ink); color: #fff; }
    .drawer__close svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .drawer__body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
    .drawer__foot { display: flex; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--fog); flex-shrink: 0; background: var(--paper); }

    /* FORM */
    .fg { display: flex; flex-direction: column; gap: 6px; }
    .fg label { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .fi { width: 100%; padding: 11px 12px; border-radius: var(--r-md); border: 1.5px solid var(--fog); background: #fff; font-family: var(--font-b); font-size: .85rem; color: var(--ink); outline: none; transition: border-color 140ms, box-shadow 140ms; appearance: none; }
    .fi:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(44,62,107,.09); }
    .fi::placeholder { color: #ccc; }
    .fhint { font-size: .63rem; color: var(--muted); line-height: 1.4; }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .femoji-row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: end; }
    .femoji-preview { height: 46px; border-radius: var(--r-md); border: 1.5px solid var(--fog); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }

    /* Chips */
    .chips, .schips { display: flex; gap: 8px; }
    .chip { flex: 1; padding: 9px 4px; border-radius: var(--r-md); border: 1.5px solid var(--fog); font-size: .68rem; font-weight: 600; text-align: center; cursor: pointer; transition: all 140ms; color: var(--muted); -webkit-tap-highlight-color: transparent; }
    .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .chip:hover:not(.active) { border-color: var(--muted); color: var(--ink); }
    .schip { flex: 1; padding: 8px 4px; border-radius: var(--r-md); border: 1.5px solid var(--fog); font-size: .62rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; text-align: center; cursor: pointer; transition: all 140ms; color: var(--muted); -webkit-tap-highlight-color: transparent; }
    .schip[data-v="ok"].active   { background: var(--green-bg); border-color: #a3cfbb; color: var(--green); }
    .schip[data-v="pend"].active { background: var(--amber-bg); border-color: #ffe08a; color: var(--amber); }
    .schip[data-v="out"].active  { background: var(--red-bg);   border-color: #f1b0b7; color: var(--red-txt); }
    .schip:hover:not(.active) { border-color: var(--muted); }

    /* Botones */
    .btn { flex: 1; padding: 12px; border-radius: var(--r-md); font-family: var(--font-d); font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border: none; transition: background 140ms, transform 110ms, opacity 140ms; -webkit-tap-highlight-color: transparent; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--indigo); }
    .btn-ghost { background: var(--fog); color: var(--muted); flex: 0 0 auto; padding: 12px 20px; }
    .btn-ghost:hover:not(:disabled) { background: var(--ink); color: #fff; }
    .btn-danger { background: rgba(192,57,43,.1); color: var(--crimson); flex: 0 0 auto; }
    .btn-danger:hover:not(:disabled) { background: var(--crimson); color: #fff; }

    /* Confirm bar */
    .confirm-bar { display: none; align-items: center; gap: 8px; padding: 10px 16px; background: #fdf0f0; border-top: 1px solid #f5c6c6; flex-shrink: 0; }
    .confirm-bar.on { display: flex; }
    .confirm-bar__msg { flex: 1; font-size: .75rem; color: var(--crimson); font-weight: 500; }

    /* BOTTOM NAV */
    .bnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 64px; background: var(--ink); border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: stretch; z-index: 200; box-shadow: 0 -8px 32px rgba(0,0,0,.35); }
    .bnav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: rgba(255,255,255,.35); font-size: .6rem; font-family: var(--font-b); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; transition: color 170ms; position: relative; -webkit-tap-highlight-color: transparent; }
    .bnav a::before { content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 2px; background: var(--crimson); border-radius: 0 0 2px 2px; opacity: 0; transition: opacity 170ms; }
    .bnav a.active { color: #fff; }
    .bnav a.active::before { opacity: 1; }
    .bnav a:hover:not(.active) { color: rgba(255,255,255,.65); }
    .bnav__icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .bnav__icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .bnav a.active .bnav__icon svg { stroke-width: 2.2; }

    @media (min-width: 481px) { body { box-shadow: var(--sh-xl); } }
  </style>
</head>
<body>

<header class="header">
  <img class="header__gif" src="resource/japon.gif" alt="">
  <span class="header__jp">入場券</span>
  <h1 class="header__title">TICKETS</h1>
  <p class="header__sub">Entradas y atracciones · Nov 2026</p>
  <div class="header__divider"></div>
</header>

<div class="summary">
  <div class="summary__item">
    <span class="summary__val" id="s-total">—</span>
    <span class="summary__lbl">Total</span>
  </div>
  <div class="summary__item">
    <span class="summary__val" id="s-conf">—</span>
    <span class="summary__lbl">Confirmados</span>
  </div>
  <div class="summary__item">
    <span class="summary__val" id="s-pend">—</span>
    <span class="summary__lbl">Pendientes</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-f="all">Todos</button>
  <button class="tab" data-f="tokio">Tokio</button>
  <button class="tab" data-f="kioto">Kioto</button>
  <button class="tab" data-f="osaka">Osaka</button>
</div>

<main id="main">
  <div class="state-msg" id="loading-msg">
    <div class="spinner"></div>
    <div class="state-msg__title">Cargando tickets…</div>
  </div>
</main>

<button class="fab" onclick="openNewCard()" aria-label="Agregar atracción">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="drawer" id="drawer">
    <div class="drawer__pill"></div>
    <div class="drawer__head">
      <span class="drawer__title" id="dr-title">Nuevo ticket</span>
      <button class="drawer__close" onclick="closeModal()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer__body" id="dr-body"></div>
    <div class="confirm-bar" id="confirm-bar">
      <span class="confirm-bar__msg" id="confirm-msg">¿Eliminar este elemento?</span>
      <button class="btn btn-ghost" style="padding:8px 14px;font-size:.65rem;" onclick="hideConfirm()">No</button>
      <button class="btn btn-danger" style="padding:8px 14px;font-size:.65rem;" id="confirm-yes">Eliminar</button>
    </div>
    <div class="drawer__foot" id="dr-foot"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bnav">
  <a href="vuelos-japon.html"><span class="bnav__icon"><svg viewBox="0 0 24 24"><path d="M22 16.5H2l3.5-5.5H18l4 5.5z"/><path d="M2 16.5l3-9 4 4 5-7 5 12"/><path d="M12 16.5v3"/><path d="M8 19.5h8"/></svg></span>Vuelos</a>
  <a href="hospedaje-japon.html"><span class="bnav__icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>Hospedaje</a>
  <a href="japon.html"><span class="bnav__icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>Itinerario</a>
  <a href="calendario-noviembre.html"><span class="bnav__icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/></svg></span>Calendario</a>
  <a href="tickets-japon.html" class="active" aria-current="page"><span class="bnav__icon"><svg viewBox="0 0 24 24"><path d="M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"/></svg></span>Tickets</a>
</nav>

<script>
/* ══════════════════════════════════════════════
   CONFIGURACIÓN
══════════════════════════════════════════════ */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzXcJ6xlM18mYoi6oWr6MYUlRtUISsA85XDvJ_PDEOI26FLmpSrVoZQyzdnjTSeam86tw/exec';

/* ══════════════════════════════════════════════
   API — comunicación con Apps Script
══════════════════════════════════════════════ */
function apiGet() {
  return fetch(GAS_URL + '?sheet=tickets').then(function(r) { return r.json(); });
}
function apiPost(body) {
  return fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); });
}

/* ══════════════════════════════════════════════
   ESTADO LOCAL
══════════════════════════════════════════════ */
var _items  = [];   // array de boletos del Sheet
var _target = null; // ítem en edición

/* ══════════════════════════════════════════════
   RENDER — construye el DOM a partir de _items
══════════════════════════════════════════════ */
var CITY_LABELS = {
  tokio: { jp: '東京', name: 'Tokio' },
  kioto: { jp: '京都', name: 'Kioto' },
  osaka: { jp: '大阪', name: 'Osaka' }
};
var BADGE = {
  ok:   { cls: 'badge--ok',   txt: 'Confirmado' },
  pend: { cls: 'badge--pend', txt: 'Pendiente'  },
  out:  { cls: 'badge--out',  txt: 'Cancelado'  }
};
var ICON_SVG = '<svg viewBox="0 0 24 24"><path d="M12.01 2.011a3.2 3.2 0 0 1 2.675 1.43l7.315 12.296a2.962 2.962 0 0 1-.048 3.015A3.073 3.073 0 0 1 19.34 20H4.66a3.073 3.073 0 0 1-2.613-1.248 2.962 2.962 0 0 1-.048-3.015l7.313-12.3a3.2 3.2 0 0 1 2.678-1.426zM12 12a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1zm0-5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>';
var EDIT_SVG = '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>';
var DOTS_SVG = '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';

function driveBtn(url) {
  if (url && url.trim()) {
    return '<a class="item__drive" href="'+x(url)+'" target="_blank" rel="noopener">'+ICON_SVG+'Ver boleto</a>';
  }
  return '<span class="item__no-drive">Sin link</span>';
}

function render(items, activeFilter) {
  _items = items;
  var filter = activeFilter || document.querySelector('.tab.active').dataset.f;
  var main   = document.getElementById('main');
  main.innerHTML = '';

  // Agrupar por ciudad → lugar
  var cities = ['tokio', 'kioto', 'osaka'];
  var byCity = {};
  cities.forEach(function(c) { byCity[c] = {}; });

  items.forEach(function(item) {
    var c = item.ciudad;
    if (!byCity[c]) byCity[c] = {};
    if (!byCity[c][item.lugar]) byCity[c][item.lugar] = [];
    byCity[c][item.lugar].push(item);
  });

  var hasAny = false;

  cities.forEach(function(city) {
    var lugares = Object.keys(byCity[city]);
    if (!lugares.length) return;
    if (filter !== 'all' && filter !== city) return;

    hasAny = true;

    // Separador ciudad
    var sep = document.createElement('div');
    sep.className = 'city-sep';
    sep.dataset.city = city;
    sep.innerHTML =
      '<span class="city-sep__jp">'  + (CITY_LABELS[city]||{jp:'?'}).jp   + '</span>' +
      '<span class="city-sep__name">'+ (CITY_LABELS[city]||{name:'?'}).name+'</span>' +
      '<div class="city-sep__line"></div>';
    main.appendChild(sep);

    // Una tarjeta por lugar
    lugares.forEach(function(lugar) {
      var filas  = byCity[city][lugar];
      var first  = filas[0];
      var estado = first.estado || 'pend';
      var badge  = BADGE[estado] || BADGE.pend;
      var emoji  = first.emoji || '🎫';
      // Fecha de la primera fila como fecha de la tarjeta
      var fecha  = first.fecha || '';
      var fechaCard = fecha ? fecha.split('·')[0].trim() + ' · ' + (CITY_LABELS[city]||{name:city}).name
                            : (CITY_LABELS[city]||{name:city}).name;

      var card = document.createElement('div');
      card.className = 'tcard';
      card.dataset.city  = city;
      card.dataset.lugar = lugar;

      // Items HTML
      var itemsHTML = filas.map(function(it) {
        return '<div class="item" data-id="'+x(it.id)+'">' +
          '<span class="item__icon">'+x(it.emoji||'🎫')+'</span>' +
          '<div class="item__info">' +
            '<div class="item__name">'+x(it.boleto)+'</div>' +
            '<div class="item__date">'+x(it.fecha)+'</div>' +
          '</div>' +
          driveBtn(it.url_drive) +
          '<button class="item__edit" onclick="openEditItem(this)" title="Editar">'+EDIT_SVG+'</button>' +
        '</div>';
      }).join('');

      card.innerHTML =
        '<div class="tcard__top">' +
          '<div class="tcard__icon" style="background:#f5f0ff;">'+x(emoji)+'</div>' +
          '<div class="tcard__info">' +
            '<div class="tcard__name">'+x(lugar)+'</div>' +
            '<div class="tcard__meta">' +
              '<span class="tcard__date">'+x(fechaCard)+'</span>' +
              '<span class="badge '+badge.cls+'">'+badge.txt+'</span>' +
            '</div>' +
          '</div>' +
          '<button class="tcard__menu-btn" onclick="openEditCard(this)">'+DOTS_SVG+'</button>' +
          '<div class="tcard__arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div>' +
        '</div>' +
        '<div class="tear"></div>' +
        '<div class="tcard__body">' +
          '<div class="items">' +
            itemsHTML +
            '<button class="items__add" onclick="openAddItem(this)">' +
              '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
              'Añadir entrada' +
            '</button>' +
          '</div>' +
        '</div>';

      card.querySelector('.tcard__top').addEventListener('click', function(e) {
        if (e.target.closest('.tcard__menu-btn')) return;
        card.classList.toggle('open');
      });

      main.appendChild(card);
    });
  });

  if (!hasAny) {
    main.innerHTML =
      '<div class="state-msg">' +
        '<div class="state-msg__icon">🎟️</div>' +
        '<div class="state-msg__title">Sin tickets</div>' +
        '<div class="state-msg__sub">Usa el botón + para agregar el primero</div>' +
      '</div>';
  }

  updateSummary(items);
}

function updateSummary(items) {
  var conf = items.filter(function(i) { return i.estado === 'ok'; }).length;
  var pend = items.filter(function(i) { return i.estado === 'pend'; }).length;
  document.getElementById('s-total').textContent = items.length;
  document.getElementById('s-conf').textContent  = conf;
  document.getElementById('s-pend').textContent  = pend;
}

/* ══════════════════════════════════════════════
   CARGA INICIAL
══════════════════════════════════════════════ */
function loadTickets() {
  document.getElementById('main').innerHTML =
    '<div class="state-msg" id="loading-msg"><div class="spinner"></div>' +
    '<div class="state-msg__title">Cargando tickets…</div></div>';

  apiGet().then(function(res) {
    if (res.ok) {
      render(res.items);
    } else {
      showError(res.error);
    }
  }).catch(function(err) {
    showError(err.message || 'Error de red');
  });
}

function showError(msg) {
  document.getElementById('main').innerHTML =
    '<div class="state-msg">' +
      '<div class="state-msg__icon">⚠️</div>' +
      '<div class="state-msg__title">No se pudo cargar</div>' +
      '<div class="state-msg__sub">'+x(msg)+'</div>' +
    '</div>';
}

loadTickets();

/* ══════════════════════════════════════════════
   FILTRO
══════════════════════════════════════════════ */
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    render(_items, tab.dataset.f);
  });
});

/* ══════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════ */
var overlay    = document.getElementById('overlay');
var drTitle    = document.getElementById('dr-title');
var drBody     = document.getElementById('dr-body');
var drFoot     = document.getElementById('dr-foot');
var confirmBar = document.getElementById('confirm-bar');
var confirmMsg = document.getElementById('confirm-msg');
var confirmYes = document.getElementById('confirm-yes');

function openModal(title, body, foot) {
  drTitle.textContent = title;
  drBody.innerHTML    = body;
  drFoot.innerHTML    = foot;
  confirmBar.classList.remove('on');
  overlay.classList.add('on');
  document.body.style.overflow = 'hidden';
  var first = drBody.querySelector('input');
  if (first) setTimeout(function() { first.focus(); }, 300);
}

function closeModal() {
  overlay.classList.remove('on');
  document.body.style.overflow = '';
  _target = null;
}
window.closeModal = closeModal;

overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

function hideConfirm() { confirmBar.classList.remove('on'); }
window.hideConfirm = hideConfirm;

function setBusy(isBusy) {
  drFoot.querySelectorAll('.btn').forEach(function(b) { b.disabled = isBusy; });
  if (isBusy) {
    var prim = drFoot.querySelector('.btn-primary');
    if (prim) prim.textContent = 'Guardando…';
  }
}

/* Chips */
window.pickChip = function(btn, group) {
  btn.closest('.'+group).querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
};
function chipVal(cls) {
  var el = drBody.querySelector(cls+' .active');
  return el ? el.dataset.v : '';
}
function cityChips(sel) {
  return [['tokio','Tokio'],['kioto','Kioto'],['osaka','Osaka']].map(function(c) {
    return '<button type="button" class="chip'+(c[0]===sel?' active':'')+'" data-v="'+c[0]+'" onclick="pickChip(this,\'chips\')">'+c[1]+'</button>';
  }).join('');
}
function statusChips(sel) {
  return [['ok','Confirmado'],['pend','Pendiente'],['out','Cancelado']].map(function(s) {
    return '<button type="button" class="schip'+(s[0]===sel?' active':'')+'" data-v="'+s[0]+'" onclick="pickChip(this,\'schips\')">'+s[1]+'</button>';
  }).join('');
}

/* ══════════════════════════════════════════════
   NUEVA TARJETA — crea el lugar + primer boleto
══════════════════════════════════════════════ */
window.openNewCard = function() {
  openModal('Nueva atracción',
    '<div class="fg"><label>Nombre del lugar *</label>' +
      '<input class="fi" id="c-lugar" placeholder="Ej: Tokyo DisneySea"></div>' +
    '<div class="frow">' +
      '<div class="fg"><label>Emoji</label>' +
        '<input class="fi" id="c-emoji" value="🎫" maxlength="4" oninput="document.getElementById(\'c-ep\').textContent=this.value||\'🎫\'"></div>' +
      '<div class="fg"><label>Preview</label><div class="femoji-preview" id="c-ep">🎫</div></div>' +
    '</div>' +
    '<div class="fg"><label>Ciudad *</label><div class="chips">'+cityChips('tokio')+'</div></div>' +
    '<div class="fg"><label>Estado</label><div class="schips">'+statusChips('pend')+'</div></div>' +
    '<hr style="border:none;border-top:1px solid var(--fog);">' +
    '<div class="fg" style="background:#f5f5f0;padding:12px;border-radius:var(--r-md);gap:10px;">' +
      '<div style="font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;">Primer boleto</div>' +
      '<div class="fg"><label>Nombre del boleto *</label>' +
        '<input class="fi" id="c-boleto" placeholder="Ej: Entrada adulto x2"></div>' +
      '<div class="fg"><label>Fecha / Horario</label>' +
        '<input class="fi" id="c-fecha" placeholder="Ej: 7 Nov · 09:00 AM"></div>' +
      '<div class="fg"><label>🔗 Link Google Drive (opcional)</label>' +
        '<input class="fi" id="c-url" type="text" placeholder="https://drive.google.com/file/…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">' +
        '<span class="fhint">Pega el link del archivo en tu Drive</span></div>' +
    '</div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
    '<button class="btn btn-primary" id="btn-save-card" onclick="saveNewCard()">Guardar</button>'
  );
};

window.saveNewCard = function() {
  var lugar  = document.getElementById('c-lugar').value.trim();
  var emoji  = document.getElementById('c-emoji').value.trim() || '🎫';
  var ciudad = chipVal('.chips') || 'tokio';
  var estado = chipVal('.schips') || 'pend';
  var boleto = document.getElementById('c-boleto').value.trim();
  var fecha  = document.getElementById('c-fecha').value.trim();
  var url    = document.getElementById('c-url').value.trim();

  if (!lugar)  { document.getElementById('c-lugar').focus(); return; }
  if (!boleto) { document.getElementById('c-boleto').focus(); return; }

  setBusy(true);
  apiPost({ action:'tickets_add', ciudad:ciudad, lugar:lugar, emoji:emoji, fecha:fecha, estado:estado, boleto:boleto, url_drive:url })
    .then(function(res) {
      if (res.ok) { render(res.items); closeModal(); }
      else { alert('Error: ' + res.error); setBusy(false); }
    }).catch(function(err) { alert('Error de red: ' + err.message); setBusy(false); });
};

/* ══════════════════════════════════════════════
   EDITAR TARJETA — edita todos los boletos del lugar
══════════════════════════════════════════════ */
window.openEditCard = function(btn) {
  var card   = btn.closest('.tcard');
  var ciudad = card.dataset.city;
  var lugar  = card.dataset.lugar;
  _target    = { ciudad: ciudad, lugar: lugar };

  // Obtener datos actuales del primer item del lugar
  var filas = _items.filter(function(i) { return i.ciudad === ciudad && i.lugar === lugar; });
  var first = filas[0] || {};

  openModal('Editar atracción',
    '<div class="fg"><label>Nombre del lugar</label>' +
      '<input class="fi" id="ec-lugar" value="'+x(lugar)+'"></div>' +
    '<div class="frow">' +
      '<div class="fg"><label>Emoji</label>' +
        '<input class="fi" id="ec-emoji" value="'+x(first.emoji||'🎫')+'" maxlength="4" oninput="document.getElementById(\'ec-ep\').textContent=this.value||\'🎫\'"></div>' +
      '<div class="fg"><label>Preview</label><div class="femoji-preview" id="ec-ep">'+x(first.emoji||'🎫')+'</div></div>' +
    '</div>' +
    '<div class="fg"><label>Ciudad</label><div class="chips">'+cityChips(ciudad)+'</div></div>' +
    '<div class="fg"><label>Estado</label><div class="schips">'+statusChips(first.estado||'pend')+'</div></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
    '<button class="btn btn-danger" onclick="askDeleteCard()">Eliminar todo</button>' +
    '<button class="btn btn-primary" onclick="saveEditCard()">Guardar</button>'
  );
};

window.askDeleteCard = function() {
  var t    = _target;
  var cnt  = _items.filter(function(i) { return i.ciudad === t.ciudad && i.lugar === t.lugar; }).length;
  confirmMsg.textContent = '¿Eliminar "'+t.lugar+'" y sus '+cnt+' boleto(s)?';
  confirmBar.classList.add('on');
  confirmYes.onclick = function() {
    // Eliminar todos los boletos del lugar secuencialmente
    var ids = _items.filter(function(i) { return i.ciudad === t.ciudad && i.lugar === t.lugar; }).map(function(i) { return i.id; });
    setBusy(true);
    var chain = Promise.resolve();
    ids.forEach(function(id) {
      chain = chain.then(function() { return apiPost({ action:'tickets_delete', id:id }); });
    });
    chain.then(function(res) {
      if (res && res.ok) { render(res.items); closeModal(); }
      else { loadTickets(); closeModal(); }
    }).catch(function() { loadTickets(); closeModal(); });
  };
};

window.saveEditCard = function() {
  var t       = _target;
  var nuevoLugar = document.getElementById('ec-lugar').value.trim();
  var emoji   = document.getElementById('ec-emoji').value.trim() || '🎫';
  var ciudad  = chipVal('.chips') || t.ciudad;
  var estado  = chipVal('.schips') || 'pend';
  if (!nuevoLugar) { document.getElementById('ec-lugar').focus(); return; }

  // Actualizar todos los boletos de este lugar
  var filas = _items.filter(function(i) { return i.ciudad === t.ciudad && i.lugar === t.lugar; });
  setBusy(true);
  var chain = Promise.resolve();
  filas.forEach(function(it) {
    chain = chain.then(function() {
      return apiPost({ action:'tickets_update', id:it.id, lugar:nuevoLugar, emoji:emoji, ciudad:ciudad, estado:estado });
    });
  });
  chain.then(function(res) {
    if (res && res.ok) { render(res.items); closeModal(); }
    else { loadTickets(); closeModal(); }
  }).catch(function() { loadTickets(); closeModal(); });
};

/* ══════════════════════════════════════════════
   AÑADIR BOLETO a una tarjeta existente
══════════════════════════════════════════════ */
window.openAddItem = function(btn) {
  var card   = btn.closest('.tcard');
  _target    = { ciudad: card.dataset.city, lugar: card.dataset.lugar };
  var filas  = _items.filter(function(i) { return i.ciudad === _target.ciudad && i.lugar === _target.lugar; });
  var first  = filas[0] || {};

  openModal('Añadir boleto — ' + _target.lugar,
    '<div class="fg"><label>Nombre del boleto *</label>' +
      '<input class="fi" id="ai-boleto" placeholder="Ej: Entrada adulto x2"></div>' +
    '<div class="fg"><label>Emoji</label>' +
      '<input class="fi" id="ai-emoji" value="'+(first.emoji||'🎫')+'" maxlength="4"></div>' +
    '<div class="fg"><label>Fecha / Horario</label>' +
      '<input class="fi" id="ai-fecha" placeholder="Ej: 7 Nov · 09:00 AM"></div>' +
    '<div class="fg"><label>🔗 Link Google Drive (opcional)</label>' +
      '<input class="fi" id="ai-url" type="text" placeholder="https://drive.google.com/file/…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">' +
      '<span class="fhint">Pega el link del archivo en tu Drive</span></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
    '<button class="btn btn-primary" onclick="saveAddItem()">Añadir</button>'
  );
};

window.saveAddItem = function() {
  var t      = _target;
  var boleto = document.getElementById('ai-boleto').value.trim();
  var emoji  = document.getElementById('ai-emoji').value.trim() || '🎫';
  var fecha  = document.getElementById('ai-fecha').value.trim();
  var url    = document.getElementById('ai-url').value.trim();
  if (!boleto) { document.getElementById('ai-boleto').focus(); return; }

  // Heredar estado y ciudad del lugar
  var filas  = _items.filter(function(i) { return i.ciudad === t.ciudad && i.lugar === t.lugar; });
  var estado = (filas[0] || {}).estado || 'pend';

  setBusy(true);
  apiPost({ action:'tickets_add', ciudad:t.ciudad, lugar:t.lugar, emoji:emoji, fecha:fecha, estado:estado, boleto:boleto, url_drive:url })
    .then(function(res) {
      if (res.ok) { render(res.items); closeModal(); }
      else { alert('Error: ' + res.error); setBusy(false); }
    }).catch(function(err) { alert('Error de red: ' + err.message); setBusy(false); });
};

/* ══════════════════════════════════════════════
   EDITAR BOLETO individual
══════════════════════════════════════════════ */
window.openEditItem = function(btn) {
  var itemEl = btn.closest('.item');
  var id     = itemEl.dataset.id;
  var it     = _items.find(function(i) { return i.id === id; });
  if (!it) return;
  _target = it;

  openModal('Editar boleto',
    '<div class="fg"><label>Nombre del boleto *</label>' +
      '<input class="fi" id="ei-boleto" value="'+x(it.boleto)+'"></div>' +
    '<div class="fg"><label>Emoji</label>' +
      '<input class="fi" id="ei-emoji" value="'+x(it.emoji||'🎫')+'" maxlength="4"></div>' +
    '<div class="fg"><label>Fecha / Horario</label>' +
      '<input class="fi" id="ei-fecha" value="'+x(it.fecha)+'"></div>' +
    '<div class="fg"><label>🔗 Link Google Drive (opcional)</label>' +
      '<input class="fi" id="ei-url" type="text" value="'+x(it.url_drive||'')+'" placeholder="https://drive.google.com/file/…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">' +
      '<span class="fhint">Pega el link del archivo en tu Drive</span></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
    '<button class="btn btn-danger" onclick="askDeleteItem()">Eliminar</button>' +
    '<button class="btn btn-primary" onclick="saveEditItem()">Guardar</button>'
  );
};

window.askDeleteItem = function() {
  var it = _target;
  confirmMsg.textContent = '¿Eliminar "'+x(it.boleto)+'"?';
  confirmBar.classList.add('on');
  confirmYes.onclick = function() {
    setBusy(true);
    apiPost({ action:'tickets_delete', id:it.id })
      .then(function(res) {
        if (res.ok) { render(res.items); closeModal(); }
        else { alert('Error: ' + res.error); setBusy(false); }
      }).catch(function(err) { alert('Error de red: ' + err.message); setBusy(false); });
  };
};

window.saveEditItem = function() {
  var it     = _target;
  var boleto = document.getElementById('ei-boleto').value.trim();
  var emoji  = document.getElementById('ei-emoji').value.trim() || '🎫';
  var fecha  = document.getElementById('ei-fecha').value.trim();
  var url    = document.getElementById('ei-url').value.trim();
  if (!boleto) { document.getElementById('ei-boleto').focus(); return; }

  setBusy(true);
  apiPost({ action:'tickets_update', id:it.id, boleto:boleto, emoji:emoji, fecha:fecha, url_drive:url })
    .then(function(res) {
      if (res.ok) { render(res.items); closeModal(); }
      else { alert('Error: ' + res.error); setBusy(false); }
    }).catch(function(err) { alert('Error de red: ' + err.message); setBusy(false); });
};

/* ══════════════════════════════════════════════
   UTILIDADES
══════════════════════════════════════════════ */
function x(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
