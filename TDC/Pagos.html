<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tarjetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235eead4'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='12' width='56' height='40' rx='8' fill='url(%23g)'/%3E%3Crect x='4' y='22' width='56' height='8' fill='%230d1117' opacity='.55'/%3E%3Crect x='11' y='38' width='14' height='9' rx='2' fill='%23f5d98a'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d1117">
<style>
:root{--bg:#0d1117;--panel:#161c26;--panel2:#1d2531;--ink:#eef2f7;--mut:#8b98a9;--line:#263041;--acc:#5eead4;--acc-ink:#04211c;--warn:#ff7b7b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(1000px 500px at 85% -10%,#173a4a55,transparent),var(--bg);color:var(--ink);font:16px/1.5 "Inter","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
main{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;margin:8px 0 26px}
.foot{display:flex;justify-content:center;margin-top:34px}
h1{font-weight:700;font-size:clamp(2.1rem,7vw,2.8rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.03em}
h2{font-size:1.1rem;margin:0}
.mut{color:var(--mut);font-size:.85rem}
button,input,select{font:inherit;color:var(--ink);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:999px;padding:12px 22px;font-weight:700;letter-spacing:.01em;cursor:pointer;
  box-shadow:0 8px 22px -8px #5eead4b0,inset 0 1px 0 #ffffff66;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px #5eead4d0,inset 0 1px 0 #ffffff66}
.btn:active{transform:scale(.96)}
.btn svg{flex:none}
.btn.ghost{background:#ffffff0f;color:var(--ink);border:1px solid #ffffff2e;box-shadow:none;backdrop-filter:blur(6px)}
.btn.ghost:hover{background:#ffffff1c;box-shadow:none}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.actions .btn{padding:8px 16px;font-size:.85rem;gap:6px;flex:0 0 auto}
.actions .btn svg{width:15px;height:15px}
.btn.danger{background:var(--warn);color:#2a0606;box-shadow:0 8px 22px -8px #ff7b7bb0,inset 0 1px 0 #ffffff55}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #5eead433}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--mut)}

/* Wallet */
#cards{display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.cc{--c:#3b82f6;position:relative;order:var(--o,0);z-index:var(--o,0);margin-top:-40px;border-radius:20px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));
  box-shadow:0 -8px 20px -10px #000c,inset 0 1px 0 #ffffff30;transition:filter .2s}
.cc.first{margin-top:0}
.cc.open{margin-bottom:50px;box-shadow:0 18px 40px -14px color-mix(in srgb,var(--c) 80%,#000),inset 0 1px 0 #ffffff30}
.cc:hover{filter:brightness(1.08)}
.cc::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#ffffff22 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.cc:hover::after{transform:translateX(120%)}
.head{position:relative;height:96px;padding:14px 16px;cursor:pointer}
.head:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.cc.open .head{height:auto;padding-bottom:8px}
.row1{display:flex;align-items:center;gap:10px}
.row1 h3{margin:0;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{width:32px;height:24px;border-radius:5px;flex:none;background:linear-gradient(135deg,#f5d98a,#c9a24a)}
.amt-h{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.sub{position:absolute;left:16px;bottom:12px;font-size:.8rem;opacity:.8}
.cc.open .sub{display:none}
.det{display:none;padding:4px 16px 16px}
.cc.open .det{display:block;animation:fadeIn .45s .12s both}
.det dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:.9rem}
.det dt{opacity:.8}.det dd{margin:0;font-weight:600;text-align:right}
.acts{display:flex;gap:8px;margin-top:14px}
.ico{background:#00000033;border:0;color:#fff;border-radius:999px;padding:6px 14px;font-size:.8rem;cursor:pointer;transition:background .15s}
.ico:hover{background:#00000066}
.empty{border:2px dashed var(--line);border-radius:18px;padding:34px 16px;text-align:center;color:var(--mut)}

/* Compras */
.cols{max-width:720px;margin:30px auto 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel form{display:grid;gap:12px;margin-top:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.flt{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bar select{width:auto;max-width:200px}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
label.chk{flex-direction:row;align-items:center;gap:8px;cursor:pointer}
label.chk input{width:auto}
.btn.sm{padding:8px 16px;font-size:.85rem}
.tag{font-size:.7rem;background:#5eead426;color:var(--acc);border-radius:6px;padding:1px 7px;margin-left:6px;font-weight:600}
.item.paid .row{opacity:.55}
.x.ok{color:var(--acc)}.x.ok:hover{background:#5eead41f}
.item{border-top:1px solid var(--line)}
.item .row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.item .row:hover{background:#ffffff08}
.item .row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.chev{flex:none;color:var(--mut);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.item.open .chev{transform:rotate(180deg)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}
.item.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden;min-height:0;visibility:hidden;opacity:0;transition:visibility .32s,opacity .25s}
.item.open .more>div{visibility:visible;opacity:1}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .d{flex:1;min-width:0}
.item .d b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
.x{background:none;border:1px solid var(--line);color:var(--warn);border-radius:999px;padding:5px 9px;cursor:pointer;transition:background .15s}
.x:hover{background:#ff7b7b1f}
.x.ed{color:var(--ink)}.x.ed:hover{background:#ffffff14}
.item .b{display:flex;gap:8px;justify-content:flex-end;padding:2px 8px 12px}
.item .b .x{padding:7px 18px;font-size:.85rem}

/* Animaciones */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.enter .cc,.enter .panel{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
.item.new{animation:slide .4s both}
.leaving{transition:all .3s;opacity:0;transform:translateX(30px)}

/* Overlay, diálogos, aviso */
#ov{position:fixed;inset:0;z-index:50;background:#070a0fcc;backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .2s}
#ov.on{opacity:1;pointer-events:auto}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:spin .8s linear infinite}
#ovt{font-weight:600}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:20px;width:min(420px,92vw)}
dialog[open]{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:#070a0fb3;backdrop-filter:blur(3px)}
dialog form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw input{display:none}
.sw span{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;cursor:pointer;transition:transform .15s}
.sw span:hover{transform:scale(1.15)}
.sw input:checked+span{border-color:#fff;transform:scale(1.15)}
.end{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-110px);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:60;transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:90vw}
#toast.on{transform:translate(-50%,0)}
#toast.err{border-color:var(--warn);color:var(--warn)}
/* Botón flotante: marcar periodo como pagado */
.fab{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;padding:14px 26px;font-size:.95rem;transform:translateX(-50%);
  animation:fabIn .45s cubic-bezier(.2,.8,.2,1),halo 2.6s 1s ease-in-out infinite}
.fab:hover{transform:translateX(-50%) scale(1.08)}
.fab:active{transform:translateX(-50%) scale(.95)}
@keyframes fabIn{from{opacity:0;transform:translateX(-50%) translateY(24px) scale(.6)}to{opacity:1;transform:translateX(-50%)}}
@keyframes halo{0%,100%{box-shadow:0 14px 30px -8px #5eead4b0,0 0 0 0 #5eead455,inset 0 1px 0 #ffffff66}50%{box-shadow:0 14px 30px -8px #5eead4b0,0 0 0 14px #5eead400,inset 0 1px 0 #ffffff66}}
main{padding-bottom:100px}
/* Pantalla de PIN */
#lock{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;
  background:radial-gradient(900px 500px at 50% -10%,#173a4a77,transparent),var(--bg);transition:opacity .45s,transform .45s}
#lock.off{opacity:0;transform:scale(1.04);pointer-events:none}
.lk{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:#5eead41a;color:var(--acc);margin-bottom:6px;animation:pop .5s both}
#lock h2{font-size:1.4rem;letter-spacing:-.02em;margin:0}
.pin{display:flex;gap:12px;margin:14px 0 4px}
.pin input{width:58px;height:66px;padding:0;text-align:center;font-size:1.7rem;font-weight:700;border-radius:16px}
.pin input.f{border-color:var(--acc);background:#5eead410}
.pin.bad{animation:shake .4s}
#pinMsg{min-height:1.4em;font-size:.88rem;color:var(--warn)}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#okIc{display:none;width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--acc-ink);place-items:center;animation:pop .35s both}
#ov.done .spin{display:none}#ov.done #okIc{display:grid}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lkT">
  <div class="lk"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h2 id="lkT">Ingresa tu PIN</h2>
  <div class="mut">Acceso personal · 4 dígitos</div>
  <div class="pin" id="pin">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Dígito 1">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Dígito 2">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Dígito 3">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Dígito 4">
  </div>
  <div id="pinMsg" role="alert"></div>
</div>

<main id="app" class="enter">
  <header>
    <h1>Mis tarjetas</h1>
    <div class="mut">Gastos, cortes y fechas de pago</div>
  </header>

  <section id="cards" aria-label="Tarjetas"></section>

  <div class="actions">
    <button class="btn ghost" id="newCard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M7 15h3"/></svg>Agregar tarjeta</button>
    <button class="btn" id="newBuy"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Registrar compra</button>
  </div>
  <p class="mut" id="hint" style="text-align:center;margin:14px 0 0">Toca una tarjeta para ver sus detalles y filtrar sus compras</p>

  <div class="cols">
    <section class="panel" style="--i:4">
      <div class="bar"><h2>Compras</h2>
        <div class="flt"><select id="filter" aria-label="Filtrar por tarjeta"></select><select id="period" aria-label="Filtrar por periodo" hidden></select></div></div>
      <div class="bar2">
        <label class="chk"><input type="checkbox" id="showPaid"> Mostrar pagadas</label>
        <span class="mut" id="sub"></span>
      </div>
      <div id="list"></div>
    </section>
  </div>
  <div class="foot"><button class="btn ghost sm" id="lockBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Bloquear</button></div>
</main>

<button class="btn fab" id="payPeriod" hidden>Marcar periodo como pagado</button>

<div id="ov" role="alert" aria-live="assertive"><div class="spin"></div><div id="okIc"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div id="ovt">Cargando…</div></div>
<div id="toast" role="status"></div>

<dialog id="cardDlg">
  <form id="cf" method="dialog">
    <h2 id="cfTitle">Nueva tarjeta</h2>
    <label>Nombre<input id="cName" maxlength="30" required placeholder="Ej. BBVA Oro"></label>
    <label>Día de corte<input id="cCut" type="number" min="1" max="31" required></label>
    <div class="mut">El pago se calcula solo: 20 días después de cada corte.</div>
    <div><div class="mut" style="margin-bottom:6px">Color</div><div class="sw" id="sw"></div></div>
    <div class="end"><button type="button" class="btn ghost" id="cCancel">Cancelar</button><button class="btn">Guardar</button></div>
  </form>
</dialog>

<dialog id="addDlg">
  <form id="f" method="dialog">
    <h2>Registrar compra</h2>
    <label>Tarjeta<select id="fCard" required></select></label>
    <div class="two">
      <label>Fecha<input id="fDate" type="date" required></label>
      <label>Monto<input id="fAmt" type="number" step="0.01" min="0.01" inputmode="decimal" required placeholder="0.00"></label>
    </div>
    <label>Descripción<input id="fDesc" maxlength="80" required placeholder="Ej. Supermercado"></label>
    <div class="end"><button type="button" class="btn ghost" id="aCancel">Cancelar</button><button class="btn">Guardar compra</button></div>
  </form>
</dialog>

<dialog id="buyDlg">
  <form id="bf" method="dialog">
    <h2>Editar compra</h2>
    <label>Tarjeta<select id="eCard" required></select></label>
    <div class="two">
      <label>Fecha<input id="eDate" type="date" required></label>
      <label>Monto<input id="eAmt" type="number" step="0.01" min="0.01" inputmode="decimal" required></label>
    </div>
    <label>Descripción<input id="eDesc" maxlength="80" required></label>
    <div class="end"><button type="button" class="btn ghost" id="eCancel">Cancelar</button><button class="btn">Guardar</button></div>
  </form>
</dialog>

<dialog id="confDlg">
  <form method="dialog" style="display:grid;gap:14px">
    <h2 id="confT"></h2><div id="confB" class="mut"></div>
    <div class="end"><button value="no" class="btn ghost">Cancelar</button><button value="yes" class="btn danger" id="confYes">Eliminar</button></div>
  </form>
</dialog>

<script>
// ====== CONFIGURACIÓN ======
const API_URL = 'https://script.google.com/macros/s/AKfycbyRPVY3zGPhE9k7v6ShhycC-wL948n9gcWgAALS1OLlWJ5NGKzyF5y9ApTeyQzysX7o/exec';
// ===========================

const PAY_DAYS = 20; // el pago vence 20 días después de la fecha de corte
const COLORS = ['#3b82f6','#8b5cf6','#ec4899','#ef4444','#f59e0b','#10b981','#14b8a6','#64748b'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const $ = id => document.getElementById(id);
const money = n => n.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const show = s => { const [y,m,d]=s.split('-'); return `${+d} ${MESES[m-1]} ${y}`; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = {tarjetas:[], compras:[]}, prev = {}, newId = null, activeId = null, periodTouched = false, pin = '', openItem = null;
const colorOf = t => t.color || COLORS[data.tarjetas.indexOf(t) % COLORS.length];

/* ---- UI helpers ---- */
let toastT;
function toast(t, err){ const e=$('toast'); e.textContent=t; e.className='on'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>e.className='',err?4500:2200); }
async function run(text, fn){
  $('ovt').textContent = text; $('ov').classList.add('on');
  const t0 = Date.now();
  try{ await fn(); return true; }
  catch(e){ toast(e.message || 'Ocurrió un error', true); return false; }
  finally{ await new Promise(r=>setTimeout(r, Math.max(0, 450-(Date.now()-t0)))); $('ov').classList.remove('on'); }
}
function confirmDlg(title, body, label='Eliminar', danger=true){
  $('confT').textContent = title; $('confB').textContent = body;
  $('confYes').textContent = label; $('confYes').className = 'btn'+(danger?' danger':'');
  const d = $('confDlg'); d.returnValue=''; d.showModal();
  return new Promise(res => d.addEventListener('close', ()=>res(d.returnValue==='yes'), {once:true}));
}
function countUp(el, to, from){
  const t0 = performance.now(), dur = 700;
  (function step(t){ const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = money(from + (to-from)*e); if(p<1) requestAnimationFrame(step); })(t0);
}

/* ---- API ---- */
async function api(body){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({pin,...body})});
  const j = await r.json(); if(j.error) throw new Error(j.error); return j;
}
async function fetchData(p){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({pin:p,action:'load'})});
  const j = await r.json(); if(j.error) throw new Error(j.error);
  j.compras.forEach(c=>{ // por si la hoja devuelve la fecha en otro formato
    if(!/^\d{4}-\d{2}-\d{2}$/.test(c.fecha)){ const d=new Date(c.fecha); if(!isNaN(d)) c.fecha=iso(d); }
  });
  return j;
}

/* ---- PIN ---- */
const pins = [...document.querySelectorAll('#pin input')];
const pinVal = () => pins.map(i=>i.value).join('');
let checking = false;
function badPin(msg){
  $('pinMsg').textContent = msg;
  const b = $('pin'); b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
  pins.forEach(i=>{ i.value=''; i.classList.remove('f'); }); pins[0].focus();
}
async function unlock(p){
  $('ovt').textContent = 'Validando PIN…'; $('ov').className = 'on';
  let j;
  try{ j = await fetchData(p); }
  catch(e){ $('ov').className = ''; throw (e instanceof TypeError ? new Error('No se pudo conectar. Revisa tu conexión y API_URL.') : e); }
  pin = p; try{ sessionStorage.setItem('pin', p); }catch(_){}
  data = j;
  $('ov').className = 'on done'; $('ovt').textContent = 'PIN correcto';
  await new Promise(r=>setTimeout(r, 850));
  $('lock').classList.add('off'); render(); $('ov').className = '';
  setTimeout(()=>$('app').classList.remove('enter'), 1200);
}
async function submitPin(){
  if(checking) return; checking = true; $('pinMsg').textContent = '';
  pins.forEach(i=>i.blur());
  try{ await unlock(pinVal()); }catch(e){ badPin(e.message); }
  checking = false;
}
pins.forEach((inp,i)=>{
  inp.addEventListener('input', ()=>{
    inp.value = inp.value.replace(/\D/g,'').slice(-1); inp.classList.toggle('f', !!inp.value);
    if(inp.value && i<3) pins[i+1].focus();
    if(pinVal().length===4) submitPin();
  });
  inp.addEventListener('keydown', e=>{
    if(e.key==='Backspace' && !inp.value && i>0){ pins[i-1].value=''; pins[i-1].classList.remove('f'); pins[i-1].focus(); }
  });
  inp.addEventListener('paste', e=>{
    const t = (e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4); if(!t) return;
    e.preventDefault(); [...t].forEach((ch,k)=>{ pins[k].value=ch; pins[k].classList.add('f'); });
    pins[Math.min(t.length,3)].focus(); if(t.length===4) submitPin();
  });
  inp.addEventListener('focus', ()=>inp.select());
});
$('lockBtn').onclick = ()=>{ try{ sessionStorage.removeItem('pin'); }catch(_){} location.reload(); };
function start(){
  let saved = null; try{ saved = sessionStorage.getItem('pin'); }catch(_){}
  if(saved) unlock(saved).catch(()=>{ try{ sessionStorage.removeItem('pin'); }catch(_){} pins[0].focus(); });
  else pins[0].focus();
}

/* ---- Fechas de corte / pago ---- */
function mDate(y,m,day){ return new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate())); }
function nextOccur(day,from){ let c=mDate(from.getFullYear(),from.getMonth(),day); if(c<from) c=mDate(from.getFullYear(),from.getMonth()+1,day); return c; }
const addDays = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const sum = (id,from,to) => data.compras.filter(c=>c.tarjeta===id&&c.fecha>from&&c.fecha<=to&&!c.pagada).reduce((a,c)=>a+c.monto,0);

/* ---- Render ---- */
function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  $('cards').innerHTML = data.tarjetas.map((t,i)=>{
    const nextCut = nextOccur(t.corte,today);
    const lastCut = mDate(nextCut.getFullYear(),nextCut.getMonth()-1,t.corte);
    const prevCut = mDate(lastCut.getFullYear(),lastCut.getMonth()-1,t.corte);
    const payLast = addDays(lastCut,PAY_DAYS), owed = payLast>=today;
    const payCur = addDays(nextCut,PAY_DAYS);
    const due = owed ? sum(t.id,iso(prevCut),iso(lastCut)) : 0;
    t._cycle = sum(t.id,iso(lastCut),iso(nextCut));
    const total = data.compras.filter(c=>c.tarjeta===t.id&&!c.pagada).reduce((a,c)=>a+c.monto,0);
    return `<article class="cc" data-id="${esc(t.id)}" style="--c:${colorOf(t)};--i:${i}">
      <div class="head" role="button" tabindex="0" aria-label="Ver detalles de ${esc(t.nombre)}">
        <div class="row1"><span class="chip"></span><h3>${esc(t.nombre)}</h3><span class="amt-h" data-cid="${esc(t.id)}">${money(t._cycle)}</span></div>
        <div class="sub">Corte ${show(iso(nextCut))}</div>
      </div>
      <div class="det"><dl>
        <dt>Gastado en este periodo</dt><dd>${money(t._cycle)}</dd>
        <dt>Próximo corte</dt><dd>${show(iso(nextCut))}</dd>
        <dt>Pago de este periodo</dt><dd>${show(iso(payCur))}</dd>
        ${due>0?`<dt>Pago pendiente (${show(iso(payLast))})</dt><dd>${money(due)}</dd>`:''}
        <dt>Total por pagar</dt><dd>${money(total)}</dd></dl>
        <div class="acts"><button class="ico" data-edit="${esc(t.id)}">Editar</button><button class="ico" data-del="${esc(t.id)}">Eliminar</button></div>
      </div></article>`;
  }).join('') || '<div class="empty">Aún no tienes tarjetas.<br>Pulsa “+ Nueva tarjeta” para empezar.</div>';
  $('hint').hidden = !data.tarjetas.length;
  layout(false);

  data.tarjetas.forEach(t=>{ const el=document.querySelector(`[data-cid="${t.id}"]`); if(el) countUp(el,t._cycle,prev[t.id]||0); prev[t.id]=t._cycle; });

  const opts = data.tarjetas.map(t=>`<option value="${esc(t.id)}">${esc(t.nombre)}</option>`).join('');
  const cur = $('fCard').value, curF = $('filter').value;
  $('fCard').innerHTML = opts; if(cur) $('fCard').value = cur;
  $('filter').innerHTML = '<option value="">Todas</option>'+opts; $('filter').value = curF;
  fillPeriods();
  renderList();
}
const pd = s => { const [y,m,d]=s.split('-'); return new Date(+y,m-1,+d); };
const cardOf = id => data.tarjetas.find(t=>t.id===id);
const periodKey = c => { const t=cardOf(c.tarjeta); return t ? iso(nextOccur(t.corte, pd(c.fecha))) : ''; };
function periodLabel(key, t){
  const end = pd(key), start = addDays(mDate(end.getFullYear(), end.getMonth()-1, t.corte), 1);
  return `${start.getDate()} ${MESES[start.getMonth()]} – ${show(key)}`;
}
function fillPeriods(){
  const f = $('filter').value, sel = $('period'), cur = sel.value;
  if(!f || !cardOf(f)){ sel.hidden = true; sel.innerHTML = ''; return; }
  const t = cardOf(f), showPaid = $('showPaid').checked;
  const keys = [...new Set(data.compras.filter(c=>c.tarjeta===f&&(showPaid||!c.pagada)).map(periodKey))].sort().reverse();
  sel.innerHTML = '<option value="">Todos los periodos</option>' + keys.map(k=>`<option value="${k}">${periodLabel(k,t)}</option>`).join('');
  if(cur && !keys.includes(cur)) periodTouched = false;
  let val = keys.includes(cur) ? cur : '';
  if(!periodTouched && keys.length > 1){          // varios periodos: abrir en el periodo en curso
    const now = new Date(); now.setHours(0,0,0,0);
    const key = iso(nextOccur(t.corte, now));
    val = keys.includes(key) ? key : keys[0];
  }
  sel.value = val;
  sel.hidden = false;
}
function visible(){
  const f = $('filter').value, p = $('period').hidden ? '' : $('period').value, sp = $('showPaid').checked;
  return data.compras.filter(c=>(!f||c.tarjeta===f)&&(!p||periodKey(c)===p)&&(sp||!c.pagada))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
const CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function toggleItem(id){ // acordeón: solo una compra abierta a la vez
  openItem = openItem===id ? null : id;
  document.querySelectorAll('#list .item').forEach(el=>{
    const o = el.dataset.row===openItem; el.classList.toggle('open', o); el.querySelector('.row').setAttribute('aria-expanded', o);
  });
}
function renderList(){
  const rows = visible();
  $('list').innerHTML = rows.map(c=>{ const t=cardOf(c.tarjeta), o=c.id===openItem;
    return `<div class="item${c.id===newId?' new':''}${c.pagada?' paid':''}${o?' open':''}" data-row="${esc(c.id)}">
      <div class="row" role="button" tabindex="0" aria-expanded="${o}"><span class="dot" style="background:${t?colorOf(t):'#555'}"></span>
        <div class="d"><b>${esc(c.desc)}${c.pagada?'<span class="tag">Pagada</span>':''}</b><span class="mut">${show(c.fecha)} · ${esc(t?t.nombre:'?')}</span></div>
        <span class="amt">${money(c.monto)}</span>${CHEV}</div>
      <div class="more"><div><span class="b"><button class="x ok" data-pay="${esc(c.id)}">${c.pagada?'Deshacer':'Pagada'}</button><button class="x ed" data-ebuy="${esc(c.id)}">Editar</button><button class="x" data-buy="${esc(c.id)}">Quitar</button></span></div></div></div>`; }).join('')
    || '<div class="mut" style="padding:14px 4px">No hay compras para mostrar.</div>';
  $('sub').textContent = rows.length ? `${rows.length} compra(s) · ${money(rows.reduce((a,c)=>a+c.monto,0))}` : '';
  $('payPeriod').hidden = !($('filter').value && !$('period').hidden && $('period').value && rows.some(c=>!c.pagada));
  newId = null;
}

/* ---- Wallet: apilar, abrir y reordenar con animación (FLIP) ---- */
function layout(animate){
  const els = [...document.querySelectorAll('#cards .cc')];
  if(!els.some(e=>e.dataset.id===activeId)) activeId = null;
  const tops = new Map(els.map(el=>[el, el.getBoundingClientRect().top]));
  const order = activeId ? [els.find(e=>e.dataset.id===activeId), ...els.filter(e=>e.dataset.id!==activeId)] : els;
  order.forEach((el,i)=>{
    el.style.setProperty('--o', i);
    el.classList.toggle('first', i===0);
    el.classList.toggle('open', el.dataset.id===activeId);
  });
  if(animate) els.forEach(el=>{
    const dy = tops.get(el) - el.getBoundingClientRect().top;
    if(dy) el.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
function selectCard(id){
  activeId = activeId===id ? null : id;
  layout(true);
  $('filter').value = activeId || ''; periodTouched = false; fillPeriods(); renderList();
}
$('cards').addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('head')){ e.preventDefault(); selectCard(e.target.closest('.cc').dataset.id); }
});

/* ---- Compras ---- */
$('f').addEventListener('submit', async e=>{
  e.preventDefault();
  if(!data.tarjetas.length) return toast('Primero agrega una tarjeta', true);
  const b = {action:'add',tarjeta:$('fCard').value,fecha:$('fDate').value,desc:$('fDesc').value.trim(),monto:parseFloat($('fAmt').value)};
  $('addDlg').close();
  const ok = await run('Registrando compra…', async()=>{ const r=await api(b); newId=r.id; data.compras.push({id:r.id,fecha:b.fecha,tarjeta:b.tarjeta,desc:b.desc,monto:b.monto,pagada:false}); });
  if(ok){ $('fDesc').value=''; $('fAmt').value=''; render(); toast('Compra registrada'); } else $('addDlg').showModal();
});
let editingBuy = null;
$('eCancel').onclick = ()=>$('buyDlg').close();
$('bf').addEventListener('submit', async e=>{
  e.preventDefault();
  const b = {tarjeta:$('eCard').value,fecha:$('eDate').value,desc:$('eDesc').value.trim(),monto:parseFloat($('eAmt').value)};
  $('buyDlg').close();
  const ok = await run('Guardando cambios…', async()=>{ await api({action:'edit',id:editingBuy,...b}); Object.assign(data.compras.find(c=>c.id===editingBuy),b); });
  if(ok){ openItem=null; render(); toast('Compra actualizada'); }
});
$('list').addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('row')){ e.preventDefault(); toggleItem(e.target.parentElement.dataset.row); }
});
$('list').addEventListener('click', async e=>{
  const hdr = e.target.closest('.row');
  if(hdr){ toggleItem(hdr.parentElement.dataset.row); return; }
  const eb = e.target.dataset.ebuy;
  if(eb){
    const c = data.compras.find(c=>c.id===eb); editingBuy = eb;
    $('eCard').innerHTML = data.tarjetas.map(t=>`<option value="${esc(t.id)}">${esc(t.nombre)}</option>`).join('');
    $('eCard').value = c.tarjeta; $('eDate').value = c.fecha; $('eDesc').value = c.desc; $('eAmt').value = c.monto;
    return $('buyDlg').showModal();
  }
  const pid = e.target.dataset.pay;
  if(pid){
    const c = data.compras.find(c=>c.id===pid), v = !c.pagada;
    const ok = await run(v?'Marcando como pagada…':'Reactivando compra…', async()=>{ await api({action:'pay',ids:[pid],value:v}); c.pagada=v; });
    if(ok){ openItem=null; render(); toast(v?'Compra marcada como pagada':'Compra reactivada'); }
    return;
  }
  const id = e.target.dataset.buy; if(!id) return;
  if(!await confirmDlg('¿Quitar esta compra?','Se eliminará también de tu hoja de Google.')) return;
  const row = document.querySelector(`[data-row="${id}"]`); row.classList.add('leaving');
  const ok = await run('Eliminando compra…', async()=>{ await api({action:'delete',id}); data.compras=data.compras.filter(c=>c.id!==id); });
  if(ok){ openItem=null; render(); toast('Compra eliminada'); } else row.classList.remove('leaving');
});
$('filter').addEventListener('change', ()=>{ activeId = $('filter').value || null; layout(true); periodTouched = false; fillPeriods(); renderList(); });
$('period').addEventListener('change', ()=>{ periodTouched = true; renderList(); });
$('showPaid').addEventListener('change', ()=>{ fillPeriods(); renderList(); });
$('payPeriod').addEventListener('click', async ()=>{
  const ids = visible().filter(c=>!c.pagada).map(c=>c.id); if(!ids.length) return;
  const total = visible().filter(c=>!c.pagada).reduce((a,c)=>a+c.monto,0);
  if(!await confirmDlg('¿Marcar periodo como pagado?', `${ids.length} compra(s) por ${money(total)} dejarán de aparecer en la lista.`, 'Marcar pagadas', false)) return;
  const ok = await run('Marcando como pagadas…', async()=>{ await api({action:'pay',ids,value:true}); data.compras.forEach(c=>{ if(ids.includes(c.id)) c.pagada=true; }); });
  if(ok){ render(); toast('Periodo marcado como pagado'); }
});

/* ---- Tarjetas ---- */
let editing = null;
$('sw').innerHTML = COLORS.map((c,i)=>`<label><input type="radio" name="col" value="${c}" ${i?'':'checked'}><span style="--c:${c}"></span></label>`).join('');
function openCard(t){
  editing = t ? t.id : null;
  $('cfTitle').textContent = t ? 'Editar tarjeta' : 'Nueva tarjeta';
  $('cName').value = t ? t.nombre : ''; $('cCut').value = t ? t.corte : '';
  const col = t ? colorOf(t) : COLORS[data.tarjetas.length % COLORS.length];
  document.querySelectorAll('#sw input').forEach(i=>i.checked = i.value===col);
  $('cardDlg').showModal();
}
$('newCard').onclick = ()=>openCard();
$('newBuy').onclick = ()=>{
  if(!data.tarjetas.length) return toast('Primero agrega una tarjeta', true);
  if(activeId) $('fCard').value = activeId;
  $('fDate').value = iso(new Date());
  $('addDlg').showModal(); $('fDesc').focus();
};
$('aCancel').onclick = ()=>$('addDlg').close();
$('cCancel').onclick = ()=>$('cardDlg').close();
$('cf').addEventListener('submit', async e=>{
  e.preventDefault();
  const b = {nombre:$('cName').value.trim(),corte:+$('cCut').value,color:document.querySelector('#sw input:checked').value};
  if(!b.nombre||b.corte<1||b.corte>31) return toast('Revisa los datos (días del 1 al 31)', true);
  $('cardDlg').close();
  const ok = await run(editing?'Guardando cambios…':'Guardando tarjeta…', async()=>{
    if(editing){ await api({action:'cardEdit',id:editing,...b}); Object.assign(data.tarjetas.find(t=>t.id===editing),{nombre:b.nombre,corte:b.corte,color:b.color}); }
    else { const r=await api({action:'cardAdd',...b}); data.tarjetas.push({id:r.id,nombre:b.nombre,corte:b.corte,color:b.color}); }
  });
  if(ok){ render(); toast(editing?'Tarjeta actualizada':'Tarjeta agregada'); }
});
$('cards').addEventListener('click', async e=>{
  const eid = e.target.dataset.edit, did = e.target.dataset.del;
  if(eid) return openCard(data.tarjetas.find(t=>t.id===eid));
  if(!did){ const h = e.target.closest('.head'); if(h) selectCard(h.closest('.cc').dataset.id); return; }
  const t = data.tarjetas.find(t=>t.id===did), n = data.compras.filter(c=>c.tarjeta===did).length;
  if(!await confirmDlg(`¿Eliminar “${t.nombre}”?`, n ? `También se eliminarán sus ${n} compra(s) registradas. No se puede deshacer.` : 'No se puede deshacer.')) return;
  const ok = await run('Eliminando tarjeta…', async()=>{ await api({action:'cardDelete',id:did}); data.tarjetas=data.tarjetas.filter(t=>t.id!==did); data.compras=data.compras.filter(c=>c.tarjeta!==did); });
  if(ok){ render(); toast('Tarjeta eliminada'); }
});

$('fDate').value = iso(new Date());
start();
</script>
