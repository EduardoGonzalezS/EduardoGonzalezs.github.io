<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tarjetas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235eead4'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='12' width='56' height='40' rx='8' fill='url(%23g)'/%3E%3Crect x='4' y='22' width='56' height='8' fill='%230d1117' opacity='.55'/%3E%3Crect x='11' y='38' width='14' height='9' rx='2' fill='%23f5d98a'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d1117">
<style>
:root{--bg:#0d1117;--panel:#161c26;--panel2:#1d2531;--ink:#eef2f7;--mut:#8b98a9;--line:#263041;--acc:#5eead4;--acc-ink:#04211c;--warn:#ff7b7b}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(1000px 500px at 85% -10%,#173a4a55,transparent),var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
h1{font-size:1.6rem;margin:0;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:0}
.mut{color:var(--mut);font-size:.85rem}
button,input,select{font:inherit;color:var(--ink);min-width:0}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:#2a0606}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #5eead433}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--mut)}

/* Tarjetas */
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;perspective:900px}
.cc{--c:#3b82f6;position:relative;border-radius:18px;padding:18px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));
  box-shadow:0 12px 30px -12px color-mix(in srgb,var(--c) 70%,#000);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.cc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff26 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.cc:hover{transform:translateY(-5px) rotateX(3deg)}
.cc:hover::after{transform:translateX(120%)}
.cc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#f5d98a,#c9a24a);margin-bottom:12px}
.cc h3{margin:0;font-size:1.05rem}
.cc .lbl{font-size:.78rem;opacity:.8;margin-top:10px}
.cc .big{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.cc dl{margin:12px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.88rem}
.cc dt{opacity:.8}.cc dd{margin:0;font-weight:600;text-align:right}
.acts{display:flex;gap:6px;position:relative;z-index:1}
.ico{background:#00000033;border:0;color:#fff;border-radius:8px;padding:5px 9px;font-size:.78rem;cursor:pointer;transition:background .15s}
.ico:hover{background:#00000066}
.empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:18px;padding:34px 16px;text-align:center;color:var(--mut)}

/* Compras */
.cols{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:28px;align-items:start}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel form{display:grid;gap:12px;margin-top:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.flt{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bar select{width:auto;max-width:200px}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
label.chk{flex-direction:row;align-items:center;gap:8px;cursor:pointer}
label.chk input{width:auto}
.btn.sm{padding:7px 12px;font-size:.85rem}
.tag{font-size:.7rem;background:#5eead426;color:var(--acc);border-radius:6px;padding:1px 7px;margin-left:6px;font-weight:600}
.item.paid{opacity:.55}
.x.ok{color:var(--acc)}.x.ok:hover{background:#5eead41f}
@media(max-width:520px){.item{flex-wrap:wrap}.item .b{width:100%;justify-content:flex-end}}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .d{flex:1;min-width:0}
.item .d b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
.x{background:none;border:1px solid var(--line);color:var(--warn);border-radius:8px;padding:5px 9px;cursor:pointer;transition:background .15s}
.x:hover{background:#ff7b7b1f}
.x.ed{color:var(--ink)}.x.ed:hover{background:#ffffff14}
.item .b{display:flex;gap:6px}

/* Animaciones */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.enter .cc,.enter .panel{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
.item.new{animation:slide .4s both}
.leaving{transition:all .3s;opacity:0;transform:translateX(30px)}

/* Overlay, diálogos, aviso */
#ov{position:fixed;inset:0;z-index:50;background:#070a0fcc;backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .2s}
#ov.on{opacity:1;pointer-events:auto}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:spin .8s linear infinite}
#ovt{font-weight:600}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:20px;width:min(420px,92vw)}
dialog[open]{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:#070a0fb3;backdrop-filter:blur(3px)}
dialog form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw input{display:none}
.sw span{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;cursor:pointer;transition:transform .15s}
.sw span:hover{transform:scale(1.15)}
.sw input:checked+span{border-color:#fff;transform:scale(1.15)}
.end{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,90px);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:60;transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:90vw}
#toast.on{transform:translate(-50%,0)}
#toast.err{border-color:var(--warn);color:var(--warn)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" class="enter">
  <header>
    <div><h1>Mis tarjetas</h1><div class="mut">Gastos, cortes y fechas de pago</div></div>
    <button class="btn" id="newCard">+ Nueva tarjeta</button>
  </header>

  <section id="cards" aria-label="Tarjetas"></section>

  <div class="cols">
    <section class="panel" style="--i:4">
      <h2>Registrar compra</h2>
      <form id="f">
        <label>Tarjeta<select id="fCard" required></select></label>
        <label>Fecha<input id="fDate" type="date" required></label>
        <label>Descripción<input id="fDesc" maxlength="80" required placeholder="Ej. Supermercado"></label>
        <label>Monto<input id="fAmt" type="number" step="0.01" min="0.01" inputmode="decimal" required placeholder="0.00"></label>
        <button class="btn">Guardar compra</button>
      </form>
    </section>
    <section class="panel" style="--i:5">
      <div class="bar"><h2>Compras</h2>
        <div class="flt"><select id="filter" aria-label="Filtrar por tarjeta"></select><select id="period" aria-label="Filtrar por periodo" hidden></select></div></div>
      <div class="bar2">
        <label class="chk"><input type="checkbox" id="showPaid"> Mostrar pagadas</label>
        <span class="mut" id="sub"></span>
      </div>
      <div class="bar2"><button class="btn sm" id="payPeriod" hidden>Marcar periodo como pagado</button></div>
      <div id="list"></div>
    </section>
  </div>
</main>

<div id="ov" role="alert" aria-live="assertive"><div class="spin"></div><div id="ovt">Cargando…</div></div>
<div id="toast" role="status"></div>

<dialog id="cardDlg">
  <form id="cf" method="dialog">
    <h2 id="cfTitle">Nueva tarjeta</h2>
    <label>Nombre<input id="cName" maxlength="30" required placeholder="Ej. BBVA Oro"></label>
    <label>Día de corte<input id="cCut" type="number" min="1" max="31" required></label>
    <div class="mut">El pago se calcula solo: 20 días después de cada corte.</div>
    <div><div class="mut" style="margin-bottom:6px">Color</div><div class="sw" id="sw"></div></div>
    <div class="end"><button type="button" class="btn ghost" id="cCancel">Cancelar</button><button class="btn">Guardar</button></div>
  </form>
</dialog>

<dialog id="buyDlg">
  <form id="bf" method="dialog">
    <h2>Editar compra</h2>
    <label>Tarjeta<select id="eCard" required></select></label>
    <div class="two">
      <label>Fecha<input id="eDate" type="date" required></label>
      <label>Monto<input id="eAmt" type="number" step="0.01" min="0.01" inputmode="decimal" required></label>
    </div>
    <label>Descripción<input id="eDesc" maxlength="80" required></label>
    <div class="end"><button type="button" class="btn ghost" id="eCancel">Cancelar</button><button class="btn">Guardar</button></div>
  </form>
</dialog>

<dialog id="confDlg">
  <form method="dialog" style="display:grid;gap:14px">
    <h2 id="confT"></h2><div id="confB" class="mut"></div>
    <div class="end"><button value="no" class="btn ghost">Cancelar</button><button value="yes" class="btn danger" id="confYes">Eliminar</button></div>
  </form>
</dialog>

<script>
// ====== CONFIGURACIÓN ======
const API_URL = 'https://script.google.com/macros/s/AKfycbyRPVY3zGPhE9k7v6ShhycC-wL948n9gcWgAALS1OLlWJ5NGKzyF5y9ApTeyQzysX7o/exec';
const TOKEN   = '35e9c83d-c818-4a82-899f-f48435fc17d2'; // igual que en Code.gs
// ===========================

const PAY_DAYS = 20; // el pago vence 20 días después de la fecha de corte
const COLORS = ['#3b82f6','#8b5cf6','#ec4899','#ef4444','#f59e0b','#10b981','#14b8a6','#64748b'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const $ = id => document.getElementById(id);
const money = n => n.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const show = s => { const [y,m,d]=s.split('-'); return `${+d} ${MESES[m-1]} ${y}`; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = {tarjetas:[], compras:[]}, prev = {}, newId = null;
const colorOf = t => t.color || COLORS[data.tarjetas.indexOf(t) % COLORS.length];

/* ---- UI helpers ---- */
let toastT;
function toast(t, err){ const e=$('toast'); e.textContent=t; e.className='on'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>e.className='',err?4500:2200); }
async function run(text, fn){
  $('ovt').textContent = text; $('ov').classList.add('on');
  const t0 = Date.now();
  try{ await fn(); return true; }
  catch(e){ toast(e.message || 'Ocurrió un error', true); return false; }
  finally{ await new Promise(r=>setTimeout(r, Math.max(0, 450-(Date.now()-t0)))); $('ov').classList.remove('on'); }
}
function confirmDlg(title, body, label='Eliminar', danger=true){
  $('confT').textContent = title; $('confB').textContent = body;
  $('confYes').textContent = label; $('confYes').className = 'btn'+(danger?' danger':'');
  const d = $('confDlg'); d.returnValue=''; d.showModal();
  return new Promise(res => d.addEventListener('close', ()=>res(d.returnValue==='yes'), {once:true}));
}
function countUp(el, to, from){
  const t0 = performance.now(), dur = 700;
  (function step(t){ const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = money(from + (to-from)*e); if(p<1) requestAnimationFrame(step); })(t0);
}

/* ---- API ---- */
async function api(body){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({token:TOKEN,...body})});
  const j = await r.json(); if(j.error) throw new Error(j.error); return j;
}
async function load(){
  const ok = await run('Cargando tus tarjetas…', async()=>{
    const r = await fetch(`${API_URL}?token=${encodeURIComponent(TOKEN)}`);
    const j = await r.json(); if(j.error) throw new Error(j.error); data = j;
    data.compras.forEach(c=>{ // por si la hoja devuelve la fecha en otro formato
      if(!/^\d{4}-\d{2}-\d{2}$/.test(c.fecha)){ const d=new Date(c.fecha); if(!isNaN(d)) c.fecha=iso(d); }
    });
  });
  render(); setTimeout(()=>$('app').classList.remove('enter'), 1200);
  if(!ok) toast('No se pudo cargar. Revisa API_URL y TOKEN.', true);
}

/* ---- Fechas de corte / pago ---- */
function mDate(y,m,day){ return new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate())); }
function nextOccur(day,from){ let c=mDate(from.getFullYear(),from.getMonth(),day); if(c<from) c=mDate(from.getFullYear(),from.getMonth()+1,day); return c; }
const addDays = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const sum = (id,from,to) => data.compras.filter(c=>c.tarjeta===id&&c.fecha>from&&c.fecha<=to&&!c.pagada).reduce((a,c)=>a+c.monto,0);

/* ---- Render ---- */
function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  $('cards').innerHTML = data.tarjetas.map((t,i)=>{
    const nextCut = nextOccur(t.corte,today);
    const lastCut = mDate(nextCut.getFullYear(),nextCut.getMonth()-1,t.corte);
    const prevCut = mDate(lastCut.getFullYear(),lastCut.getMonth()-1,t.corte);
    const payLast = addDays(lastCut,PAY_DAYS), owed = payLast>=today;
    const payCur = addDays(nextCut,PAY_DAYS);                       // pago de las compras del periodo actual
    const due = owed ? sum(t.id,iso(prevCut),iso(lastCut)) : 0;   // estado de cuenta anterior aún por pagar
    t._cycle = sum(t.id,iso(lastCut),iso(nextCut));
    const total = data.compras.filter(c=>c.tarjeta===t.id&&!c.pagada).reduce((a,c)=>a+c.monto,0);
    return `<article class="cc" style="--c:${colorOf(t)};--i:${i}">
      <div class="top"><div><div class="chip"></div><h3>${esc(t.nombre)}</h3></div>
        <div class="acts"><button class="ico" data-edit="${esc(t.id)}">Editar</button><button class="ico" data-del="${esc(t.id)}">Eliminar</button></div></div>
      <div class="lbl">Gastado en este periodo</div><div class="big" data-cid="${esc(t.id)}">${money(t._cycle)}</div>
      <dl><dt>Próximo corte</dt><dd>${show(iso(nextCut))}</dd>
      <dt>Pago de este periodo</dt><dd>${show(iso(payCur))}</dd>
      ${due>0?`<dt>Pago pendiente (${show(iso(payLast))})</dt><dd>${money(due)}</dd>`:''}
      <dt>Total por pagar</dt><dd>${money(total)}</dd></dl></article>`;
  }).join('') || '<div class="empty">Aún no tienes tarjetas.<br>Pulsa “+ Nueva tarjeta” para empezar.</div>';

  data.tarjetas.forEach(t=>{ const el=document.querySelector(`[data-cid="${t.id}"]`); if(el) countUp(el,t._cycle,prev[t.id]||0); prev[t.id]=t._cycle; });

  const opts = data.tarjetas.map(t=>`<option value="${esc(t.id)}">${esc(t.nombre)}</option>`).join('');
  const cur = $('fCard').value, curF = $('filter').value;
  $('fCard').innerHTML = opts; if(cur) $('fCard').value = cur;
  $('filter').innerHTML = '<option value="">Todas</option>'+opts; $('filter').value = curF;
  fillPeriods();
  renderList();
}
const pd = s => { const [y,m,d]=s.split('-'); return new Date(+y,m-1,+d); };
const cardOf = id => data.tarjetas.find(t=>t.id===id);
const periodKey = c => { const t=cardOf(c.tarjeta); return t ? iso(nextOccur(t.corte, pd(c.fecha))) : ''; };
function periodLabel(key, t){
  const end = pd(key), start = addDays(mDate(end.getFullYear(), end.getMonth()-1, t.corte), 1);
  return `${start.getDate()} ${MESES[start.getMonth()]} – ${show(key)}`;
}
function fillPeriods(){
  const f = $('filter').value, sel = $('period'), cur = sel.value;
  if(!f || !cardOf(f)){ sel.hidden = true; sel.innerHTML = ''; return; }
  const t = cardOf(f), showPaid = $('showPaid').checked;
  const keys = [...new Set(data.compras.filter(c=>c.tarjeta===f&&(showPaid||!c.pagada)).map(periodKey))].sort().reverse();
  sel.innerHTML = '<option value="">Todos los periodos</option>' + keys.map(k=>`<option value="${k}">${periodLabel(k,t)}</option>`).join('');
  sel.value = keys.includes(cur) ? cur : '';
  sel.hidden = false;
}
function visible(){
  const f = $('filter').value, p = $('period').hidden ? '' : $('period').value, sp = $('showPaid').checked;
  return data.compras.filter(c=>(!f||c.tarjeta===f)&&(!p||periodKey(c)===p)&&(sp||!c.pagada))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
function renderList(){
  const rows = visible();
  $('list').innerHTML = rows.map(c=>{ const t=cardOf(c.tarjeta);
    return `<div class="item${c.id===newId?' new':''}${c.pagada?' paid':''}" data-row="${esc(c.id)}"><span class="dot" style="background:${t?colorOf(t):'#555'}"></span>
      <div class="d"><b>${esc(c.desc)}${c.pagada?'<span class="tag">Pagada</span>':''}</b><span class="mut">${show(c.fecha)} · ${esc(t?t.nombre:'?')}</span></div>
      <span class="amt">${money(c.monto)}</span>
      <span class="b"><button class="x ok" data-pay="${esc(c.id)}">${c.pagada?'Deshacer':'Pagada'}</button><button class="x ed" data-ebuy="${esc(c.id)}">Editar</button><button class="x" data-buy="${esc(c.id)}">Quitar</button></span></div>`; }).join('')
    || '<div class="mut" style="padding:14px 4px">No hay compras para mostrar.</div>';
  $('sub').textContent = rows.length ? `${rows.length} compra(s) · ${money(rows.reduce((a,c)=>a+c.monto,0))}` : '';
  $('payPeriod').hidden = !($('filter').value && !$('period').hidden && $('period').value && rows.some(c=>!c.pagada));
  newId = null;
}

/* ---- Compras ---- */
$('f').addEventListener('submit', async e=>{
  e.preventDefault();
  if(!data.tarjetas.length) return toast('Primero agrega una tarjeta', true);
  const b = {action:'add',tarjeta:$('fCard').value,fecha:$('fDate').value,desc:$('fDesc').value.trim(),monto:parseFloat($('fAmt').value)};
  const ok = await run('Registrando compra…', async()=>{ const r=await api(b); newId=r.id; data.compras.push({id:r.id,fecha:b.fecha,tarjeta:b.tarjeta,desc:b.desc,monto:b.monto,pagada:false}); });
  if(ok){ $('fDesc').value=''; $('fAmt').value=''; render(); toast('Compra registrada'); }
});
let editingBuy = null;
$('eCancel').onclick = ()=>$('buyDlg').close();
$('bf').addEventListener('submit', async e=>{
  e.preventDefault();
  const b = {tarjeta:$('eCard').value,fecha:$('eDate').value,desc:$('eDesc').value.trim(),monto:parseFloat($('eAmt').value)};
  $('buyDlg').close();
  const ok = await run('Guardando cambios…', async()=>{ await api({action:'edit',id:editingBuy,...b}); Object.assign(data.compras.find(c=>c.id===editingBuy),b); });
  if(ok){ render(); toast('Compra actualizada'); }
});
$('list').addEventListener('click', async e=>{
  const eb = e.target.dataset.ebuy;
  if(eb){
    const c = data.compras.find(c=>c.id===eb); editingBuy = eb;
    $('eCard').innerHTML = data.tarjetas.map(t=>`<option value="${esc(t.id)}">${esc(t.nombre)}</option>`).join('');
    $('eCard').value = c.tarjeta; $('eDate').value = c.fecha; $('eDesc').value = c.desc; $('eAmt').value = c.monto;
    return $('buyDlg').showModal();
  }
  const pid = e.target.dataset.pay;
  if(pid){
    const c = data.compras.find(c=>c.id===pid), v = !c.pagada;
    const ok = await run(v?'Marcando como pagada…':'Reactivando compra…', async()=>{ await api({action:'pay',ids:[pid],value:v}); c.pagada=v; });
    if(ok){ render(); toast(v?'Compra marcada como pagada':'Compra reactivada'); }
    return;
  }
  const id = e.target.dataset.buy; if(!id) return;
  if(!await confirmDlg('¿Quitar esta compra?','Se eliminará también de tu hoja de Google.')) return;
  const row = document.querySelector(`[data-row="${id}"]`); row.classList.add('leaving');
  const ok = await run('Eliminando compra…', async()=>{ await api({action:'delete',id}); data.compras=data.compras.filter(c=>c.id!==id); });
  if(ok){ render(); toast('Compra eliminada'); } else row.classList.remove('leaving');
});
$('filter').addEventListener('change', ()=>{ fillPeriods(); renderList(); });
$('period').addEventListener('change', renderList);
$('showPaid').addEventListener('change', ()=>{ fillPeriods(); renderList(); });
$('payPeriod').addEventListener('click', async ()=>{
  const ids = visible().filter(c=>!c.pagada).map(c=>c.id); if(!ids.length) return;
  const total = visible().filter(c=>!c.pagada).reduce((a,c)=>a+c.monto,0);
  if(!await confirmDlg('¿Marcar periodo como pagado?', `${ids.length} compra(s) por ${money(total)} dejarán de aparecer en la lista.`, 'Marcar pagadas', false)) return;
  const ok = await run('Marcando como pagadas…', async()=>{ await api({action:'pay',ids,value:true}); data.compras.forEach(c=>{ if(ids.includes(c.id)) c.pagada=true; }); });
  if(ok){ render(); toast('Periodo marcado como pagado'); }
});

/* ---- Tarjetas ---- */
let editing = null;
$('sw').innerHTML = COLORS.map((c,i)=>`<label><input type="radio" name="col" value="${c}" ${i?'':'checked'}><span style="--c:${c}"></span></label>`).join('');
function openCard(t){
  editing = t ? t.id : null;
  $('cfTitle').textContent = t ? 'Editar tarjeta' : 'Nueva tarjeta';
  $('cName').value = t ? t.nombre : ''; $('cCut').value = t ? t.corte : '';
  const col = t ? colorOf(t) : COLORS[data.tarjetas.length % COLORS.length];
  document.querySelectorAll('#sw input').forEach(i=>i.checked = i.value===col);
  $('cardDlg').showModal();
}
$('newCard').onclick = ()=>openCard();
$('cCancel').onclick = ()=>$('cardDlg').close();
$('cf').addEventListener('submit', async e=>{
  e.preventDefault();
  const b = {nombre:$('cName').value.trim(),corte:+$('cCut').value,color:document.querySelector('#sw input:checked').value};
  if(!b.nombre||b.corte<1||b.corte>31) return toast('Revisa los datos (días del 1 al 31)', true);
  $('cardDlg').close();
  const ok = await run(editing?'Guardando cambios…':'Guardando tarjeta…', async()=>{
    if(editing){ await api({action:'cardEdit',id:editing,...b}); Object.assign(data.tarjetas.find(t=>t.id===editing),{nombre:b.nombre,corte:b.corte,color:b.color}); }
    else { const r=await api({action:'cardAdd',...b}); data.tarjetas.push({id:r.id,nombre:b.nombre,corte:b.corte,color:b.color}); }
  });
  if(ok){ render(); toast(editing?'Tarjeta actualizada':'Tarjeta agregada'); }
});
$('cards').addEventListener('click', async e=>{
  const eid = e.target.dataset.edit, did = e.target.dataset.del;
  if(eid) return openCard(data.tarjetas.find(t=>t.id===eid));
  if(!did) return;
  const t = data.tarjetas.find(t=>t.id===did), n = data.compras.filter(c=>c.tarjeta===did).length;
  if(!await confirmDlg(`¿Eliminar “${t.nombre}”?`, n ? `También se eliminarán sus ${n} compra(s) registradas. No se puede deshacer.` : 'No se puede deshacer.')) return;
  const ok = await run('Eliminando tarjeta…', async()=>{ await api({action:'cardDelete',id:did}); data.tarjetas=data.tarjetas.filter(t=>t.id!==did); data.compras=data.compras.filter(c=>c.tarjeta!==did); });
  if(ok){ render(); toast('Tarjeta eliminada'); }
});

$('fDate').value = iso(new Date());
load();
</script>
