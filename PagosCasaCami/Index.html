<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Pagos de la casa</title>
<style>
  :root {
    --bg: #f3f6f5; --card: #ffffff; --text: #16211f; --muted: #6b7a77;
    --brand: #0f766e; --brand-2: #14b8a6; --border: #e2e8e6; --danger: #b42318;
    --shadow: 0 4px 18px rgba(15, 60, 55, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1514; --card:#172120; --text:#e8f1ef; --muted:#93a6a2; --border:#25322f; --shadow:none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px 40px; }

  header {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff; margin: 0 -16px 16px; padding: calc(env(safe-area-inset-top) + 22px) 20px 56px;
    border-radius: 0 0 28px 28px;
  }
  header small { opacity: .85; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
  header h1 { margin: 4px 0 0; font-size: 34px; font-weight: 700; }
  header .count { opacity: .9; font-size: 14px; margin-top: 2px; }

  .card {
    background: var(--card); border-radius: 18px; padding: 18px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .card.form { margin-top: -40px; }
  h2 { font-size: 16px; margin: 0 0 14px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
  input {
    width: 100%; font-size: 17px; padding: 13px 14px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--brand-2); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }

  .chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid var(--border); background: transparent; color: var(--text);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
  }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  button.save {
    width: 100%; margin-top: 18px; padding: 15px; font-size: 17px; font-weight: 600;
    border: 0; border-radius: 14px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
  }
  button.save:disabled { opacity: .6; }

  .list-head { display: flex; justify-content: space-between; align-items: center; margin: 24px 4px 10px; }
  .list-head h2 { margin: 0; }
  .list-head button { background: none; border: 0; color: var(--brand-2); font-size: 14px; cursor: pointer; }

  .year { font-size: 12px; font-weight: 700; color: var(--muted); margin: 16px 4px 6px; letter-spacing: .06em; }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  }
  .dot {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: rgba(20,184,166,.14); font-size: 19px; flex: none;
  }
  .meta { flex: 1; min-width: 0; }
  .meta .d { font-weight: 600; font-size: 15px; }
  .meta .m { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { font-weight: 700; font-size: 16px; white-space: nowrap; }

  .empty, .loading { text-align: center; color: var(--muted); padding: 30px 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translate(-50%, 30px); opacity: 0; transition: .25s;
    background: #16211f; color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 14px;
    pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--danger); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <small>Total pagado</small>
    <h1 id="total">$0.00</h1>
    <div class="count" id="count">Cargando…</div>
  </header>

  <div class="card form">
    <h2>➕ Nuevo pago</h2>

    <div class="row">
      <div>
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div>
        <label for="monto">Monto</label>
        <input type="number" id="monto" inputmode="decimal" placeholder="1000" step="0.01" min="0">
      </div>
    </div>

    <label for="pago">Forma de pago</label>
    <input type="text" id="pago" placeholder="Efectivo, Transferencia…" autocomplete="off">
    <div class="chips" id="chips">
      <button type="button" class="chip" data-v="Efectivo">Efectivo</button>
      <button type="button" class="chip" data-v="Transferencia">Transferencia</button>
    </div>

    <button class="save" id="btnSave">Guardar pago</button>
  </div>

  <div class="list-head">
    <h2>Pagos registrados</h2>
    <button id="btnReload">↻ Actualizar</button>
  </div>
  <div id="list"><div class="loading">Cargando pagos…</div></div>

</div>
<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const money = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n);
  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  function todayISO() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function prettyDate(f) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f);
    return m ? `${parseInt(m[3])} ${MESES[parseInt(m[2]) - 1]} ${m[1]}` : f;
  }

  function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => t.className = 'toast', 2600);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(data) {
    $('total').textContent = money(data.total);
    $('count').textContent = data.pagos.length + (data.pagos.length === 1 ? ' pago registrado' : ' pagos registrados');

    if (!data.pagos.length) {
      $('list').innerHTML = '<div class="empty">Aún no hay pagos.</div>';
      return;
    }

    // Más recientes primero (el orden del sheet es cronológico)
    const pagos = data.pagos.slice().reverse();
    let html = '', yearActual = '';
    pagos.forEach(p => {
      const y = (/^(\d{4})/.exec(p.fecha) || [])[1] || '';
      if (y !== yearActual) { yearActual = y; html += `<div class="year">${y}</div>`; }
      const icon = /efectivo/i.test(p.pago) ? '💵' : /transf/i.test(p.pago) ? '🏦' : '💳';
      html += `
        <div class="item">
          <div class="dot">${icon}</div>
          <div class="meta">
            <div class="d">${esc(prettyDate(p.fecha))}</div>
            <div class="m">${esc(p.pago || '—')}</div>
          </div>
          <div class="amt">${money(p.monto)}</div>
        </div>`;
    });
    $('list').innerHTML = html;
  }

  function load() {
    $('list').innerHTML = '<div class="loading">Cargando pagos…</div>';
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(e => { $('list').innerHTML = '<div class="empty">Error al cargar</div>'; toast(e.message, true); })
      .getPagos();
  }

  function save() {
    const fecha = $('fecha').value, monto = parseFloat($('monto').value), pago = $('pago').value.trim();
    if (!fecha) return toast('Elige la fecha', true);
    if (!monto || monto <= 0) return toast('Escribe un monto válido', true);
    if (!pago) return toast('Indica la forma de pago', true);

    const btn = $('btnSave');
    btn.disabled = true; btn.textContent = 'Guardando…';

    google.script.run
      .withSuccessHandler(data => {
        btn.disabled = false; btn.textContent = 'Guardar pago';
        $('monto').value = ''; $('pago').value = ''; setChip('');
        render(data);
        toast('✅ Pago guardado');
      })
      .withFailureHandler(e => {
        btn.disabled = false; btn.textContent = 'Guardar pago';
        toast(e.message, true);
      })
      .agregarPago(fecha, monto, pago);
  }

  function setChip(v) {
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.v === v));
  }

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    $('pago').value = c.dataset.v; setChip(c.dataset.v);
  }));
  $('pago').addEventListener('input', e => setChip(e.target.value.trim()));
  $('btnSave').addEventListener('click', save);
  $('btnReload').addEventListener('click', load);

  $('fecha').value = todayISO();
  load();
</script>
</body>
</html>
