<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repostería Belén - Sellos</title>
<link rel="icon" type="image/png" href="assets/img/rol.png">
<style>
  :root{
    --bg:#fff3f6;
    --card:#ffffff;
    --primary:#e88aa5;
    --primary-dark:#d9678a;
    --accent:#ffc2d1;
    --text:#5c3346;
    --muted:#b48c9d;
    --border:#fbdde7;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding:20px 16px 40px;
  }
  .app{width:100%;max-width:420px;}
  h1{font-size:1.4rem;text-align:center;margin:8px 0 4px;color:var(--primary-dark);}
  .brand-icon{height:1.5em;width:auto;vertical-align:-0.3em;margin-right:6px;border-radius:8px;}
  h1.brand-logo{margin:8px 0 4px;text-align:center;}
  .logo-img{
    width:100%;max-width:280px;
    aspect-ratio:3884/1260;
    object-fit:cover;
    object-position:50% 56%;
    display:block;margin:0 auto;
  }
  .subtitle{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:20px;}
  .tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:18px;border:1px solid var(--border);}
  .tab{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s;}
  .tab.active{background:var(--primary);color:#fff;}
  .screen{display:none;}
  .screen.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .card{background:var(--card);border-radius:18px;padding:22px;border:1px solid var(--border);box-shadow:0 4px 14px rgba(216,103,138,.08);}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    font-size:1rem;background:#fff8fa;color:var(--text);
  }
  input:focus{outline:2px solid var(--accent);}
  .pin-boxes{display:flex;gap:10px;justify-content:center;}
  .pin-box{
    width:52px;height:56px;padding:0;text-align:center;
    font-size:1.5rem;font-weight:700;letter-spacing:0;
  }
  button{
    width:100%;margin-top:20px;padding:13px;border:none;border-radius:12px;
    background:var(--primary);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  button:active{background:var(--primary-dark);transform:scale(.97);}
  button:hover{box-shadow:0 6px 16px rgba(216,103,138,.3);}
  button.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary);margin-top:10px;}
  .error{color:#c0392b;font-size:.82rem;margin-top:10px;text-align:center;}
  .status{padding:12px 14px;border-radius:12px;font-size:.85rem;margin:12px 0;animation:popIn .3s ease;}
  .status.ok{background:rgba(63,145,66,.12);color:#3f9142;}

  #scroll-hint-wrap{text-align:center;}
  #scroll-hint{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;padding:0;border-radius:50%;
    background:var(--primary);color:#fff;border:none;
    box-shadow:0 4px 10px rgba(216,103,138,.3);cursor:pointer;
    margin:14px auto 0;
    transition:opacity .35s ease, transform .35s ease;
    animation:scrollHintGlow 2.2s ease-in-out infinite;
  }
  #scroll-hint::after{
    content:"";
    position:absolute;inset:0;border-radius:50%;
    box-shadow:0 0 0 0 rgba(216,103,138,.55);
    animation:scrollHintPing 2.2s ease-out infinite;
    pointer-events:none;
  }
  #scroll-hint.hidden{
    opacity:0;pointer-events:none;
    transform:translateY(6px) scale(.95);
    animation:none;
  }
  #scroll-hint.hidden::after{display:none;}
  #scroll-hint .scroll-hint-label{display:none;}
  #scroll-hint .scroll-hint-arrow{font-size:1.15rem;line-height:1;animation:bounceArrow 1.4s ease-in-out infinite;}
  @keyframes bounceArrow{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(3px);}
  }
  @keyframes scrollHintGlow{
    0%,100%{box-shadow:0 4px 10px rgba(216,103,138,.3);}
    50%{box-shadow:0 4px 22px rgba(216,103,138,.75), 0 0 14px rgba(255,194,209,.9);}
  }
  @keyframes scrollHintPing{
    0%{box-shadow:0 0 0 0 rgba(216,103,138,.55);opacity:1;}
    70%{box-shadow:0 0 0 14px rgba(216,103,138,0);opacity:0;}
    100%{box-shadow:0 0 0 14px rgba(216,103,138,0);opacity:0;}
  }
  .qr-box{text-align:center;margin-top:18px;}
  .qr-box img{border-radius:12px;border:1px solid var(--border);padding:10px;background:#fff;animation:popIn .4s ease;}
  .qr-id{font-family:monospace;font-size:.85rem;color:var(--muted);margin-top:8px;word-break:break-all;}
  .stamp-header{text-align:center;margin-bottom:18px;}
  .stamp-header .name{font-size:1.1rem;font-weight:700;animation:fade .4s ease;}
  .stamp-count{font-size:2.4rem;font-weight:800;color:var(--primary);text-align:center;margin:6px 0 2px;animation:popIn .35s ease;}
  .stamp-label{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:16px;}
  .stamps-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0 4px;}
  .stamp{
    aspect-ratio:1;border-radius:50%;border:2px dashed var(--border);
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;
    transition:transform .2s ease, background .3s ease, border .3s ease;
  }
  .stamp.filled{background:var(--accent);border:2px solid var(--accent);color:#fff;animation:stampPop .4s ease backwards;}
  .stamp img{width:65%;height:65%;object-fit:contain;}
  .catalog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px;}
  .product-card{
    position:relative;
    background:var(--card);border-radius:22px;
    overflow:hidden;opacity:0;animation:slideUp .5s ease forwards;
    box-shadow:0 3px 8px rgba(216,103,138,.10), 0 1px 2px rgba(92,51,70,.06);
    transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease;
    isolation:isolate;
  }
  .product-card::before{
    content:"";position:absolute;inset:0;border-radius:22px;padding:1.5px;
    background:linear-gradient(140deg, rgba(255,255,255,.9), var(--accent) 45%, var(--primary) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:.55; pointer-events:none; z-index:2;
    transition:opacity .35s ease;
  }
  .product-card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 16px 30px rgba(216,103,138,.28), 0 4px 10px rgba(216,103,138,.14);}
  .product-card:hover::before{opacity:1;}
  .product-card:active{transform:translateY(-2px) scale(.99);}
  .product-card .img-wrap{
    aspect-ratio:1;width:100%;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,.85), transparent 55%),
      linear-gradient(135deg, var(--bg), var(--accent) 60%, var(--primary) 130%);
    display:flex;align-items:center;justify-content:center;
  }
  .product-card .img-wrap::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg, transparent 20%, rgba(255,255,255,.55) 38%, transparent 55%);
    background-size:220% 220%;background-position:130% 0;
    transition:background-position .7s ease;
    pointer-events:none;
  }
  .product-card:hover .img-wrap::after{background-position:-30% 100%;}
  .product-card .img-wrap img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .45s cubic-bezier(.22,1,.36,1);
    filter:drop-shadow(0 6px 10px rgba(92,51,70,.18));
  }
  .product-card:hover .img-wrap img{transform:scale(1.1) rotate(-1deg);}
  .product-card .emoji-fallback{
    font-size:3.1rem;position:relative;z-index:1;
    filter:drop-shadow(0 6px 10px rgba(92,51,70,.22));
    animation:wiggle 2.5s ease-in-out infinite;
    transition:transform .35s cubic-bezier(.22,1,.36,1);
  }
  .product-card:hover .emoji-fallback{transform:scale(1.12) rotate(-4deg);}
  .product-card .emoji-fallback::before{
    content:"";position:absolute;left:50%;top:50%;
    width:78px;height:78px;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,.85), rgba(255,255,255,0) 70%);
    border-radius:50%;z-index:-1;
  }
  .product-card .info{padding:12px 13px 15px;position:relative;}
  .product-card .info::before{
    content:"";position:absolute;top:0;left:13px;right:13px;height:1px;
    background:linear-gradient(90deg, transparent, var(--border), transparent);
  }
  .product-card .pname{font-weight:800;font-size:.86rem;line-height:1.28;color:var(--text);letter-spacing:-.01em;}
  .product-card .pdesc{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.35;}
  .product-card .sparkle{
    position:absolute;top:10px;right:12px;font-size:.9rem;z-index:1;
    opacity:0;transform:scale(.6) rotate(-15deg);
    transition:opacity .3s ease, transform .3s ease;
    filter:drop-shadow(0 2px 3px rgba(92,51,70,.25));
  }
  .product-card:hover .sparkle{opacity:1;transform:scale(1) rotate(0deg);}
  .logout{text-align:center;margin-top:18px;}
  .logout a{color:var(--muted);font-size:.8rem;text-decoration:underline;cursor:pointer;}
  .note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:14px;}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(36,26,19,.55);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:16px;
  }
  .loading-overlay.active{display:flex;}
  .loading-box{
    background:var(--card);border-radius:18px;padding:28px 30px;
    text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);
    animation:popIn .25s ease;
  }
  .spinner{
    width:44px;height:44px;border-radius:50%;
    border:4px solid var(--border);border-top-color:var(--primary);
    margin:0 auto 14px;
    animation:spin .8s linear infinite;
  }
  .loading-box p{margin:0;font-weight:700;color:var(--text);font-size:1rem;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @keyframes popIn{
    from{opacity:0;transform:scale(.85);}
    to{opacity:1;transform:scale(1);}
  }
  @keyframes stampPop{
    0%{transform:scale(0);opacity:0;}
    60%{transform:scale(1.15);opacity:1;}
    100%{transform:scale(1);}
  }
  @keyframes slideUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(0deg);}
    25%{transform:rotate(-8deg);}
    75%{transform:rotate(8deg);}
  }
  h1{animation:slideUp .4s ease;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="loading-text">Iniciando sesión...</p>
  </div>
</div>

<script>
function mostrarCarga(texto){
  document.getElementById("loading-text").textContent = texto;
  document.getElementById("loading-overlay").classList.add("active");
}
function ocultarCarga(){
  document.getElementById("loading-overlay").classList.remove("active");
}
function mensajeErrorLogin(data){
  const raw = (data && data.error ? String(data.error).toLowerCase() : "");
  if(raw.includes("contraseñ") || raw.includes("password") || raw.includes("clave")){
    return "Pin incorrecto.";
  }
  if(raw.includes("no encontr") || raw.includes("no existe") || raw.includes("usuario") || raw.includes("telefono") || raw.includes("teléfono")){
    return "Usuario no encontrado.";
  }
  return (data && data.error) ? data.error : "No se pudo iniciar sesión. Intenta de nuevo.";
}

const API_URL = "https://script.google.com/macros/s/AKfycbwPszTqEYXE6gdQqiFxe-be3t68txgsXmA6bM__Fw3hf-W6n1NL8cU09pUIEO3nECRr/exec";

function getSession(){
  try{ return JSON.parse(localStorage.getItem("sellos_sesion")); }catch(e){ return null; }
}
function setSession(cliente){
  try{ localStorage.setItem("sellos_sesion", JSON.stringify(cliente)); }catch(e){}
}
function clearSession(){
  localStorage.removeItem("sellos_sesion");
}

async function apiCall(params){
  const url = new URL(API_URL);
  Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
  const res = await fetch(url.toString());
  return res.json();
}

const productosFallback = [
  {emoji:"🍪", nombre:"Galletas de dulce de leche", desc:"Suaves, rellenas de dulce de leche casero"},
  {emoji:"🌀", nombre:"Roles de canela", desc:"Esponjosos, con glaseado cremoso"},
  {emoji:"🍫", nombre:"Brownies", desc:"Chocolate intenso, textura fudgy"},
  {emoji:"🍌", nombre:"Pan de plátano", desc:"Húmedo, receta tradicional"},
  {emoji:"🌽", nombre:"Pan de elote", desc:"Dulce, suave, sabor casero"},
];

let state = { screen: "login", loading: false, catalogo: null };

function render(){
  const app = document.getElementById("app");
  const session = getSession();

  if(session){
    app.innerHTML = renderLoggedIn(session);
    cargarCatalogoSiFalta();
    refrescarEstadoCliente(session.id);
    setupScrollHint();
  } else {
    app.innerHTML = renderAuth();
    ocultarScrollHint();
  }
  attachHandlers();
}

// Botón inline debajo del QR que lleva al catálogo con scroll suave.
// Se desvanece únicamente cuando el usuario lo presiona.
function ocultarScrollHint(){
  const btn = document.getElementById("scroll-hint");
  if(btn) btn.classList.add("hidden");
}

function setupScrollHint(){
  const btn = document.getElementById("scroll-hint");
  const objetivo = document.getElementById("catalogo-heading");
  if(!btn || !objetivo) return;

  btn.classList.remove("hidden");
  btn.onclick = ()=>{
    objetivo.scrollIntoView({ behavior: "smooth", block: "start" });
    btn.classList.add("hidden"); // se desvanece en cuanto lo presionan
  };
}

async function cargarCatalogoSiFalta(){
  if(state.catalogo) { actualizarCatalogoDom(); return; }
  try{
    const data = await apiCall({accion:"catalogo"});
    if(data.ok && data.productos && data.productos.length){
      state.catalogo = data.productos.map(p => ({
        emoji: p.emoji || "🍰", nombre: p.producto, desc: p.descripcion
      }));
    } else {
      state.catalogo = productosFallback;
    }
  }catch(e){
    state.catalogo = productosFallback;
  }
  actualizarCatalogoDom();
}

// Convierte "Roles de canela" en "roles-de-canela" para adivinar el nombre
// del archivo de imagen en assets/img/productos/. Si el producto trae su
// propio campo "imagen" (del catálogo), ese se usa en su lugar.
function slugify(str){
  return (str || "")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-+|-+$)/g, "");
}

function actualizarCatalogoDom(){
  const cont = document.getElementById("catalog-list");
  if(!cont) return;
  const lista = state.catalogo || productosFallback;
  cont.innerHTML = lista.map((p,i) => {
    const imgSrc = p.imagen || `assets/img/productos/${slugify(p.nombre)}.png`;
    return `
    <div class="product-card" style="animation-delay:${i*0.08}s">
      <span class="sparkle">✨</span>
      <div class="img-wrap">
        <img src="${imgSrc}" alt="${p.nombre}" loading="lazy"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="emoji-fallback" style="display:none;">${p.emoji || "🍰"}</div>
      </div>
      <div class="info">
        <div class="pname">${p.nombre}</div>
        <div class="pdesc">${p.desc}</div>
      </div>
    </div>
  `;
  }).join("");
}

async function refrescarEstadoCliente(id){
  try{
    const data = await apiCall({accion:"estado", id});
    if(data.ok){
      setSession(data.cliente);
      const countEl = document.querySelector(".stamp-count");
      if(countEl && Number(countEl.textContent.split("/")[0]) !== Number(data.cliente.sellos)){
        actualizarSellosDom(data.cliente); // actualiza solo el contador/tarjeta, sin redibujar todo (evita parpadeo del logo)
      }
    }
  }catch(e){ /* silencioso: seguimos con lo que ya teníamos en sesión */ }
}

function actualizarSellosDom(cliente){
  const total = 10;
  const sellos = Number(cliente.sellos) || 0;
  const completo = sellos >= total;

  const countEl = document.querySelector(".stamp-count");
  if(countEl) countEl.textContent = `${sellos}/${total}`;

  let stampsHtml = "";
  for(let i=0;i<total;i++){
    const delay = i<sellos ? `style="animation-delay:${i*0.06}s"` : "";
    stampsHtml += `<div class="stamp ${i<sellos?'filled':''}" ${delay}>${i<sellos?'<img src="assets/img/rol.png" alt="">':''}</div>`;
  }
  const gridEl = document.querySelector(".stamps-grid");
  if(gridEl) gridEl.innerHTML = stampsHtml;

  const card = document.querySelector(".card");
  if(card){
    let statusEl = card.querySelector(".status.ok");
    if(completo && !statusEl){
      statusEl = document.createElement("div");
      statusEl.className = "status ok";
      statusEl.style.textAlign = "center";
      statusEl.textContent = "🎉 ¡Completaste tu tarjeta! Ven a canjear tu premio.";
      card.querySelector(".stamp-label").insertAdjacentElement("afterend", statusEl);
    } else if(!completo && statusEl){
      statusEl.remove();
    }
  }
}

function renderAuth(){
  return `
    <h1 class="brand-logo"><img src="assets/img/RB-Logo.png" alt="Repostería Belén" class="logo-img" onerror="this.style.display='none';"></h1>
    <div class="subtitle">Junta sellos y canjea tus postres favoritos</div>
    <div class="tabs">
      <div class="tab ${state.screen==='login'?'active':''}" data-tab="login">Iniciar sesión</div>
      <div class="tab ${state.screen==='registro'?'active':''}" data-tab="registro">Registrarme</div>
    </div>

    <div class="screen ${state.screen==='login'?'active':''}" id="screen-login">
      <div class="card">
        <label>Número de teléfono</label>
        <input type="tel" id="login-tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" placeholder="10 dígitos">
        <label>Pin</label>
        <div class="pin-boxes" data-pin-group="login">
          <input type="password" class="pin-box" id="login-pin-0" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          <input type="password" class="pin-box" id="login-pin-1" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          <input type="password" class="pin-box" id="login-pin-2" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          <input type="password" class="pin-box" id="login-pin-3" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
        </div>
        <button id="btn-login">${state.loading ? "Entrando..." : "Entrar"}</button>
        <div class="error" id="login-error"></div>
      </div>
    </div>

    <div class="screen ${state.screen==='registro'?'active':''}" id="screen-registro">
      <div class="card">
        <label>Nombre</label>
        <input type="text" id="reg-nombre" placeholder="Tu nombre">
        <label>Número de teléfono</label>
        <input type="tel" id="reg-tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" placeholder="10 dígitos">
        <label>Pin (4 dígitos)</label>
        <div class="pin-boxes" data-pin-group="reg">
          <input type="password" class="pin-box" id="reg-pin-0" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          <input type="password" class="pin-box" id="reg-pin-1" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          <input type="password" class="pin-box" id="reg-pin-2" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          <input type="password" class="pin-box" id="reg-pin-3" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
        </div>
        <button id="btn-registro">${state.loading ? "Creando..." : "Crear mi tarjeta de sellos"}</button>
        <div class="error" id="reg-error"></div>
      </div>
    </div>
  `;
}

function renderLoggedIn(cliente){
  const total = 10;
  const sellos = Number(cliente.sellos) || 0;
  let stampsHtml = "";
  for(let i=0;i<total;i++){
    const delay = i<sellos ? `style="animation-delay:${i*0.06}s"` : "";
    stampsHtml += `<div class="stamp ${i<sellos?'filled':''}" ${delay}>${i<sellos?'<img src="assets/img/rol.png" alt="">':''}</div>`;
  }
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(cliente.id)}&size=220x220`;

  const completo = sellos >= total;

  return `
    <h1 class="brand-logo" style="margin-bottom:14px;"><img src="assets/img/RB-Logo.png" alt="Repostería Belén" class="logo-img" onerror="this.style.display='none';"></h1>
    <div class="stamp-header">
      <div class="name">Hola, ${cliente.nombre} 👋</div>
    </div>
    <div class="card">
      <div class="stamp-count">${sellos}/${total}</div>
      <div class="stamp-label">sellos acumulados</div>
      ${completo ? `<div class="status ok" style="text-align:center;">🎉 ¡Completaste tu tarjeta! Ven a canjear tu premio.</div>` : ""}
      <div class="stamps-grid">${stampsHtml}</div>
      <div class="qr-box">
        <img src="${qrUrl}" alt="QR del cliente">
        <div class="qr-id">${cliente.id}</div>
      </div>
    </div>
    <div id="scroll-hint-wrap">
      <button id="scroll-hint" aria-label="Ver catálogo de productos">
        <span class="scroll-hint-arrow">⌄</span>
        <span class="scroll-hint-label">Ver catálogo</span>
      </button>
    </div>

    <h1 id="catalogo-heading" style="margin-top:24px;">Nuestro catálogo</h1>
    <div class="catalog-grid" id="catalog-list"></div>

    <div class="logout"><a id="btn-logout">Cerrar sesión</a></div>
  `;
}

function soloDigitos(el, maxLen){
  if(!el) return;
  el.oninput = ()=>{
    el.value = el.value.replace(/\D/g, "").slice(0, maxLen);
  };
}

function getPin(prefix){
  let pin = "";
  for(let i=0;i<4;i++){
    const box = document.getElementById(`${prefix}-pin-${i}`);
    pin += box ? box.value : "";
  }
  return pin;
}

function setupPinGroup(prefix){
  const boxes = [0,1,2,3].map(i => document.getElementById(`${prefix}-pin-${i}`));
  boxes.forEach((box, i)=>{
    if(!box) return;
    box.oninput = ()=>{
      box.value = box.value.replace(/\D/g, "").slice(0,1);
      if(box.value && boxes[i+1]) boxes[i+1].focus();
    };
    box.onkeydown = (e)=>{
      if(e.key === "Backspace" && !box.value && boxes[i-1]){
        boxes[i-1].focus();
      }
    };
    box.onpaste = (e)=>{
      const texto = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
      if(!texto) return;
      e.preventDefault();
      texto.slice(0,4).split("").forEach((d, idx)=>{
        if(boxes[idx]) boxes[idx].value = d;
      });
      const siguiente = boxes[Math.min(texto.length,3)];
      if(siguiente) siguiente.focus();
    };
  });
}

function attachHandlers(){
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.onclick = ()=>{ state.screen = tab.dataset.tab; render(); };
  });

  soloDigitos(document.getElementById("login-tel"), 10);
  soloDigitos(document.getElementById("reg-tel"), 10);
  setupPinGroup("login");
  setupPinGroup("reg");

  const btnLogin = document.getElementById("btn-login");
  if(btnLogin){
    btnLogin.onclick = async ()=>{
      const telefono = document.getElementById("login-tel").value.trim();
      const password = getPin("login");
      const err = document.getElementById("login-error");
      if(!telefono || !password){
        err.textContent = "Completa ambos campos.";
        return;
      }
      if(telefono.length !== 10){
        err.textContent = "El número de teléfono debe tener 10 dígitos.";
        return;
      }
      if(password.length !== 4){
        err.textContent = "El Pin debe ser de 4 dígitos.";
        return;
      }
      err.textContent = "";
      mostrarCarga("Iniciando sesión...");
      try{
        const data = await apiCall({accion:"login", telefono, password});
        ocultarCarga();
        if(data.ok){
          setSession(data.cliente);
          render();
        } else {
          document.getElementById("login-error").textContent = mensajeErrorLogin(data);
        }
      }catch(e){
        ocultarCarga();
        document.getElementById("login-error").textContent = "Error de conexión. Intenta de nuevo.";
      }
    };
  }

  const btnReg = document.getElementById("btn-registro");
  if(btnReg){
    btnReg.onclick = async ()=>{
      const nombre = document.getElementById("reg-nombre").value.trim();
      const telefono = document.getElementById("reg-tel").value.trim();
      const password = getPin("reg");
      const err = document.getElementById("reg-error");
      if(!nombre || !telefono || !password){
        err.textContent = "Completa todos los campos.";
        return;
      }
      if(telefono.length !== 10){
        err.textContent = "El número de teléfono debe tener 10 dígitos.";
        return;
      }
      if(password.length !== 4){
        err.textContent = "El Pin debe ser de 4 dígitos.";
        return;
      }
      err.textContent = "";
      mostrarCarga("Creando tu cuenta...");
      try{
        const data = await apiCall({accion:"registro", nombre, telefono, password});
        ocultarCarga();
        if(data.ok){
          setSession(data.cliente);
          render();
        } else {
          document.getElementById("reg-error").textContent = data.error || "No se pudo registrar. Intenta de nuevo.";
        }
      }catch(e){
        ocultarCarga();
        document.getElementById("reg-error").textContent = "Error de conexión. Intenta de nuevo.";
      }
    };
  }

  const btnLogout = document.getElementById("btn-logout");
  if(btnLogout){
    btnLogout.onclick = ()=>{
      clearSession();
      state.screen = "login";
      render();
    };
  }
}

render();
</script>
</body>
</html>
