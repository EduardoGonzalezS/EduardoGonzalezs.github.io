<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repostería Belén - Panel Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#fdf6ee;
    --card:#ffffff;
    --primary:#8a5a3c;
    --primary-dark:#6b4128;
    --accent:#e8b04b;
    --text:#3a2a20;
    --muted:#8a7b6f;
    --border:#eee0d0;
    --ok:#3f9142;
    --err:#c0392b;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241a13; --card:#2f2319; --text:#f3e9df; --muted:#b8a798; --border:#4a3a2c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241a13; --card:#2f2319; --text:#f3e9df; --muted:#b8a798; --border:#4a3a2c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;align-items:center;min-height:100%;
    padding:20px 16px 40px;
  }
  .app{width:100%;max-width:440px;}
  h1{font-size:1.3rem;text-align:center;margin:8px 0 2px;color:var(--primary-dark);}
  .subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:18px;}
  .card{background:var(--card);border-radius:18px;padding:20px;border:1px solid var(--border);box-shadow:0 4px 14px rgba(138,90,60,.06);margin-bottom:16px;}
  #reader{width:100%;border-radius:14px;overflow:hidden;}
  button{
    width:100%;padding:13px;border:none;border-radius:12px;
    background:var(--primary);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  button:active{transform:scale(.97);background:var(--primary-dark);}
  button.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary);margin-top:10px;}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:10px 0 6px;}
  input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    font-size:1rem;background:var(--bg);color:var(--text);
  }
  .status{margin-top:14px;padding:14px;border-radius:12px;font-size:.9rem;display:none;animation:popIn .3s ease;}
  .status.ok{background:rgba(63,145,66,.12);color:var(--ok);display:block;}
  .status.err{background:rgba(192,57,43,.12);color:var(--err);display:block;}
  .loading-overlay{
    position:fixed;inset:0;background:rgba(36,26,19,.55);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:16px;
  }
  .loading-overlay.active{display:flex;}
  .loading-box{
    background:var(--card);border-radius:18px;padding:28px 30px;
    text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);
    animation:popIn .25s ease;
  }
  .spinner{
    width:44px;height:44px;border-radius:50%;
    border:4px solid var(--border);border-top-color:var(--primary);
    margin:0 auto 14px;
    animation:spin .8s linear infinite;
  }
  .loading-box p{margin:0;font-weight:700;color:var(--text);font-size:1rem;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .confirm-box{max-width:320px;}
  .confirm-box p{font-size:1rem;line-height:1.4;}
  .confirm-actions{display:flex;gap:10px;margin-top:18px;}
  .confirm-actions button{margin:0;}
  .cliente-info{text-align:center;margin-top:6px;}
  .cliente-info .nombre{font-size:1.15rem;font-weight:700;}
  .cliente-info .sellos{font-size:2rem;font-weight:800;color:var(--primary);margin-top:4px;}
  .toggle-mode{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:16px;border:1px solid var(--border);}
  .toggle-mode div{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;}
  .toggle-mode div.active{background:var(--primary);color:#fff;}
  .hidden{display:none;}
  .clientes-search{margin-top:10px;}
  .clientes-header{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .btn-refresh{width:auto;padding:7px 12px;font-size:.75rem;margin:0;}
  .cliente-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
  .cliente-row:last-child{border-bottom:none;}
  .cliente-datos{flex:1;min-width:0;}
  .cliente-datos .nombre-row{font-weight:700;font-size:.92rem;}
  .cliente-datos .sub-row{font-size:.72rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cliente-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .btn-adjust{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--primary);
    background:transparent;color:var(--primary);font-size:1.1rem;font-weight:800;
    padding:0;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .btn-adjust:active{background:var(--primary);color:#fff;transform:scale(.92);}
  .btn-adjust:disabled{opacity:.4;cursor:default;}
  .badge-sellos{min-width:24px;text-align:center;font-weight:800;color:var(--primary);font-size:.95rem;}
  .clientes-empty{text-align:center;color:var(--muted);font-size:.85rem;padding:22px 0;}
  @keyframes popIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  .note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:14px;}
</style>
</head>
<body>
<div class="app">
  <h1>🥐 Panel Admin</h1>
  <div class="subtitle">Repostería Belén — otorgar sellos</div>

  <div class="toggle-mode">
    <div id="mode-scan" class="active">Escanear QR</div>
    <div id="mode-manual">Buscar por ID</div>
    <div id="mode-clientes">Clientes</div>
  </div>

  <div id="section-scan" class="card">
    <div id="reader"></div>
    <button id="btn-start-scan" style="margin-top:14px;">Iniciar cámara</button>
    <button id="btn-stop-scan" class="secondary hidden">Detener cámara</button>
  </div>

  <div id="section-manual" class="card hidden">
    <label>ID del cliente</label>
    <input type="text" id="manual-id" placeholder="CLI-XXXXX-1234">
    <button id="btn-manual-sellar" style="margin-top:14px;">Sumar sello</button>
  </div>

  <div id="section-clientes" class="card hidden">
    <div class="clientes-header">
      <label style="margin:0;">Clientes registrados</label>
      <button id="btn-refrescar-clientes" class="secondary btn-refresh">↻ Actualizar</button>
    </div>
    <input type="text" id="clientes-search" class="clientes-search" placeholder="Buscar por nombre, teléfono o ID/QR">
    <div id="clientes-msg" class="status" style="display:none;margin-top:10px;"></div>
    <div id="clientes-list" style="margin-top:6px;"></div>
  </div>

  <div class="card" id="result-card" style="display:none;">
    <div class="cliente-info" id="cliente-info"></div>
  </div>

  <div class="note">Cada escaneo o búsqueda suma 1 sello al cliente. En "Clientes" puedes sumar o quitar sellos manualmente.</div>
</div>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="loading-text">Registrando sello...</p>
  </div>
</div>

<div class="loading-overlay" id="confirm-overlay">
  <div class="loading-box confirm-box">
    <p id="confirm-text">¿Confirmar acción?</p>
    <div class="confirm-actions">
      <button id="btn-confirm-no" class="secondary">Cancelar</button>
      <button id="btn-confirm-yes">Confirmar</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwPszTqEYXE6gdQqiFxe-be3t68txgsXmA6bM__Fw3hf-W6n1NL8cU09pUIEO3nECRr/exec";

let html5QrCode = null;
let scanning = false;
let cooldown = false;

async function apiCall(params){
  const url = new URL(API_URL);
  Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
  const res = await fetch(url.toString());
  return res.json();
}

function mostrarCarga(texto){
  document.getElementById("loading-text").textContent = texto;
  document.getElementById("loading-overlay").classList.add("active");
}
function ocultarCarga(){
  document.getElementById("loading-overlay").classList.remove("active");
}

// Muestra un modal de confirmación y resuelve true/false según lo que elija el usuario.
function pedirConfirmacion(mensaje){
  return new Promise(resolve=>{
    document.getElementById("confirm-text").textContent = mensaje;
    const overlay = document.getElementById("confirm-overlay");
    overlay.classList.add("active");
    const btnSi = document.getElementById("btn-confirm-yes");
    const btnNo = document.getElementById("btn-confirm-no");
    const cerrar = (resultado)=>{
      overlay.classList.remove("active");
      btnSi.onclick = null;
      btnNo.onclick = null;
      resolve(resultado);
    };
    btnSi.onclick = ()=> cerrar(true);
    btnNo.onclick = ()=> cerrar(false);
  });
}

function mostrarStatus(msg, tipo){
  const card = document.getElementById("result-card");
  const info = document.getElementById("cliente-info");
  card.style.display = "block";
  info.innerHTML = `<div class="status ${tipo}">${msg}</div>`;
  if(tipo === "err"){
    info.innerHTML += `<button id="btn-reintentar" style="margin-top:10px;">Reintentar</button>`;
    const btnReintentar = document.getElementById("btn-reintentar");
    if(btnReintentar){
      btnReintentar.onclick = ()=>{
        card.style.display = "none";
        startScanner();
      };
    }
  }
}

function mostrarCliente(cliente){
  const card = document.getElementById("result-card");
  const info = document.getElementById("cliente-info");
  card.style.display = "block";
  info.innerHTML = `
    <div class="status ok">✅ Sello registrado correctamente</div>
    <div class="nombre">${cliente.nombre}</div>
    <div class="sellos">${cliente.sellos} sellos</div>
    <button id="btn-escanear-otro" style="margin-top:14px;">Escanear otro QR</button>
  `;
  const btnOtro = document.getElementById("btn-escanear-otro");
  if(btnOtro){
    btnOtro.onclick = ()=>{
      card.style.display = "none";
      startScanner();
    };
  }
}

async function sellarCliente(id){
  if(cooldown) return;
  cooldown = true;
  mostrarCarga("Registrando sello...");
  try{
    const data = await apiCall({accion:"sellar", id});
    ocultarCarga();
    if(data.ok){
      mostrarCliente(data.cliente);
    } else {
      mostrarStatus("❌ " + (data.error || "Cliente no encontrado"), "err");
    }
  }catch(e){
    ocultarCarga();
    mostrarStatus("❌ Error de conexión", "err");
  }
  setTimeout(()=>{ cooldown = false; }, 2500);
}

function onScanSuccess(decodedText){
  if(cooldown) return;
  stopScanner();
  sellarCliente(decodedText.trim());
}

function startScanner(){
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 220 },
    onScanSuccess,
    ()=>{} // ignorar errores de frame sin QR
  ).then(()=>{
    scanning = true;
    document.getElementById("btn-start-scan").classList.add("hidden");
    document.getElementById("btn-stop-scan").classList.remove("hidden");
  }).catch(err=>{
    mostrarStatus("❌ No se pudo acceder a la cámara: " + err, "err");
  });
}

function stopScanner(){
  if(html5QrCode && scanning){
    html5QrCode.stop().then(()=>{
      scanning = false;
      document.getElementById("btn-start-scan").classList.remove("hidden");
      document.getElementById("btn-stop-scan").classList.add("hidden");
    });
  }
}

document.getElementById("btn-start-scan").onclick = startScanner;
document.getElementById("btn-stop-scan").onclick = stopScanner;

document.getElementById("btn-manual-sellar").onclick = ()=>{
  const id = document.getElementById("manual-id").value.trim();
  if(!id){
    mostrarStatus("Escribe un ID de cliente.", "err");
    return;
  }
  sellarCliente(id);
};

const MODOS = ["scan", "manual", "clientes"];
function setModo(activo){
  MODOS.forEach(m=>{
    document.getElementById(`mode-${m}`).classList.toggle("active", m === activo);
    document.getElementById(`section-${m}`).classList.toggle("hidden", m !== activo);
  });
  document.getElementById("result-card").style.display = "none";
  stopScanner();
  if(activo === "clientes") cargarClientes(false);
}
document.getElementById("mode-scan").onclick = ()=> setModo("scan");
document.getElementById("mode-manual").onclick = ()=> setModo("manual");
document.getElementById("mode-clientes").onclick = ()=> setModo("clientes");

// ---- Clientes: listar, buscar, sumar/quitar sellos ----
let listaClientes = null; // null = aún no cargada
let mensajeClientesTimeout = null;

function normalizar(str){
  return (str || "").toString().toLowerCase();
}

function mostrarMensajeClientes(msg, tipo){
  const el = document.getElementById("clientes-msg");
  if(!el) return;
  el.textContent = msg;
  el.className = "status " + tipo;
  el.style.display = "block";
  clearTimeout(mensajeClientesTimeout);
  mensajeClientesTimeout = setTimeout(()=>{ el.style.display = "none"; }, 2500);
}

async function cargarClientes(forzar){
  if(listaClientes !== null && !forzar){
    renderClientesList(document.getElementById("clientes-search").value.trim());
    return;
  }
  listaClientes = null;
  renderClientesList("");
  try{
    const data = await apiCall({accion:"clientes"});
    listaClientes = (data.ok && Array.isArray(data.clientes)) ? data.clientes : [];
    if(!data.ok) mostrarMensajeClientes("❌ " + (data.error || "No se pudo cargar la lista."), "err");
  }catch(e){
    listaClientes = [];
    mostrarMensajeClientes("❌ Error de conexión.", "err");
  }
  renderClientesList(document.getElementById("clientes-search").value.trim());
}

function renderClientesList(filtro){
  const cont = document.getElementById("clientes-list");
  if(!cont) return;

  if(listaClientes === null){
    cont.innerHTML = `<div class="clientes-empty">Cargando clientes...</div>`;
    return;
  }

  const f = normalizar(filtro);
  const filtrados = !f ? listaClientes : listaClientes.filter(c =>
    normalizar(c.nombre).includes(f) ||
    normalizar(c.telefono).includes(f) ||
    normalizar(c.id).includes(f)
  );

  if(!filtrados.length){
    cont.innerHTML = `<div class="clientes-empty">${listaClientes.length ? "Sin resultados." : "No hay clientes registrados."}</div>`;
    return;
  }

  cont.innerHTML = filtrados.map(c => `
    <div class="cliente-row" data-id="${c.id}">
      <div class="cliente-datos">
        <div class="nombre-row">${c.nombre}</div>
        <div class="sub-row">${c.telefono ? c.telefono + " · " : ""}${c.id}</div>
      </div>
      <div class="cliente-controls">
        <button class="btn-adjust" data-action="restar" data-id="${c.id}" ${c.sellos <= 0 ? "disabled" : ""}>−</button>
        <span class="badge-sellos" id="badge-${c.id}">${c.sellos}</span>
        <button class="btn-adjust" data-action="sumar" data-id="${c.id}">+</button>
      </div>
    </div>
  `).join("");

  cont.querySelectorAll(".btn-adjust").forEach(btn=>{
    btn.onclick = ()=> ajustarSello(btn.dataset.id, btn.dataset.action === "sumar" ? 1 : -1);
  });
}

async function ajustarSello(id, delta){
  const cliente = listaClientes.find(c => c.id === id);
  const nombre = cliente ? cliente.nombre : "este cliente";
  const mensaje = delta > 0
    ? `¿Sumar 1 sello a ${nombre}?`
    : `¿Quitar 1 sello a ${nombre}?`;

  const confirmado = await pedirConfirmacion(mensaje);
  if(!confirmado) return;

  const fila = document.querySelector(`.cliente-row[data-id="${CSS.escape(id)}"]`);
  const botones = fila ? fila.querySelectorAll(".btn-adjust") : [];
  botones.forEach(b => b.disabled = true);
  mostrarCarga("Actualizando sellos...");
  try{
    const data = await apiCall({accion:"sellar", id, delta});
    ocultarCarga();
    if(data.ok && data.cliente){
      const idx = listaClientes.findIndex(c => c.id === id);
      if(idx > -1) listaClientes[idx].sellos = data.cliente.sellos;
      renderClientesList(document.getElementById("clientes-search").value.trim());
    } else {
      mostrarMensajeClientes("❌ " + (data.error || "No se pudo actualizar el sello."), "err");
      botones.forEach(b => b.disabled = false);
    }
  }catch(e){
    ocultarCarga();
    mostrarMensajeClientes("❌ Error de conexión.", "err");
    botones.forEach(b => b.disabled = false);
  }
}

document.getElementById("clientes-search").oninput = (e)=> renderClientesList(e.target.value);
document.getElementById("btn-refrescar-clientes").onclick = ()=> cargarClientes(true);
</script>
</body>
</html>
